<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>API-HUB · 接口调试台</title>
<style>
/* ───────────────────────── 主题令牌 ───────────────────────── */
:root{
  --bg:#ffffff; --bg2:#f7f8fa; --bg3:#eef0f4; --bg-hover:rgba(16,24,40,.05);
  --fg:#101828; --fg2:#475467; --fg3:#8b93a1;
  --line:#e4e7ec; --line2:#d0d5dd;
  --accent:#4f46e5; --accent2:#4338ca; --accent-wash:rgba(79,70,229,.09);
  --ok:#0a8f5b; --warn:#b45309; --bad:#d92d20; --info:#175cd3;
  --m-get:#0a8f5b; --m-post:#b45309; --m-put:#175cd3; --m-patch:#7839ee; --m-del:#d92d20; --m-other:#667085;
  --code-bg:#f7f8fa; --k:#a626a4; --s:#0a7f4b; --n:#b45309; --l:#175cd3;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono","Consolas","Liberation Mono","Menlo",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --r:7px;
}
html[data-theme="dark"]{
  --bg:#0e1116; --bg2:#151a21; --bg3:#1c2230; --bg-hover:rgba(255,255,255,.06);
  --fg:#e6e9ef; --fg2:#a9b2c0; --fg3:#727c8d;
  --line:#242b36; --line2:#333c4a;
  --accent:#8f8cfb; --accent2:#a5a2fd; --accent-wash:rgba(143,140,251,.14);
  --ok:#3ecf8e; --warn:#f0a25a; --bad:#ff6b6b; --info:#6aa6ff;
  --m-get:#3ecf8e; --m-post:#f0a25a; --m-put:#6aa6ff; --m-patch:#b18cf8; --m-del:#ff6b6b; --m-other:#8b93a1;
  --code-bg:#11151b; --k:#d98cf0; --s:#7ee2a8; --n:#f0b072; --l:#7fb4ff;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--sans);font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--accent-wash)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--fg3);border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;flex-direction:column;height:100%;min-height:0}

/* ───────────────────────── 顶栏 ───────────────────────── */
.topbar{display:flex;align-items:center;gap:10px;padding:0 12px;height:46px;flex:none;
  border-bottom:1px solid var(--line);background:var(--bg2)}
.brand{display:flex;align-items:center;gap:8px;flex:none;user-select:none}
.logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(145deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.brand b{font-size:13.5px;letter-spacing:.4px}
.brand .ver{font-size:10px;color:var(--fg3);border:1px solid var(--line2);border-radius:4px;padding:0 4px;line-height:14px}
.storeline{display:flex;align-items:center;gap:6px;min-width:0;margin-left:6px;padding-left:10px;border-left:1px solid var(--line)}
.path{font-family:var(--mono);font-size:11px;color:var(--fg3);max-width:46vw;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left;cursor:pointer;border-radius:4px;
  padding:2px 4px;margin-left:-4px}
.path:hover{background:var(--bg-hover);color:var(--fg2)}
.path[data-dirty="1"]{color:var(--warn)}
.grow{flex:1}
.tools{display:flex;align-items:center;gap:6px;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:28px;padding:0 10px;
  border-radius:var(--r);border:1px solid var(--line2);background:var(--bg);color:var(--fg2);
  cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:var(--bg3);color:var(--fg);border-color:var(--fg3)}
.btn:active{transform:translateY(.5px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.icon{width:28px;padding:0;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}

/* ───────────────────────── 主体 ───────────────────────── */
.main{display:flex;flex:1;min-height:0}
.side{width:var(--side-w,240px);flex:none;display:flex;flex-direction:column;min-height:0;
  border-right:1px solid var(--line);background:var(--bg2)}
.sideDrag{width:5px;flex:none;cursor:col-resize;background:transparent;position:relative;z-index:6}
.sideDrag:hover,.sideDrag.on{background:var(--accent)}
.sideTop{display:flex;align-items:center;gap:6px;padding:8px;flex:none}
.searchWrap{position:relative;flex:1;min-width:0}
.searchWrap svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--fg3);pointer-events:none}
.searchWrap input{width:100%;height:28px;padding:0 8px 0 27px;border-radius:var(--r);
  border:1px solid var(--line2);background:var(--bg);outline:none}
.searchWrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}

.list{flex:1;min-height:0;overflow:auto;padding:2px 6px 16px}
.sideFoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;
  flex:none;border-top:1px solid var(--line);font-size:11px;color:var(--fg3)}
.link{border:0;background:none;padding:0;color:var(--fg3);cursor:pointer;font-size:11px;text-decoration:underline dotted}
.link:hover{color:var(--accent)}

/* 集合行 */
.collection{display:flex;align-items:center;gap:5px;padding:5px 6px;margin-top:4px;border-radius:5px;
  cursor:pointer;color:var(--fg);font-size:12.5px;user-select:none;font-weight:600}
.collection:hover{background:var(--bg-hover)}
.collection .caret{width:12px;text-align:center;color:var(--fg3);font-size:9px;transition:transform .12s}
.collection[data-open="0"] .caret{transform:rotate(-90deg)}
.collection .cname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.collection .ccount{font-size:10px;color:var(--fg3);font-weight:400;font-variant-numeric:tabular-nums}
.collection .facts{display:none;gap:1px;flex:none}
.collection:hover .facts{display:flex}
.collection.dragging,.req.dragging{opacity:.4}
.collection.drop-before,.req.drop-before{box-shadow:inset 0 2px 0 0 var(--accent)}
.collection.drop-after,.req.drop-after{box-shadow:inset 0 -2px 0 0 var(--accent)}
.collection.drop-into,.folder.drop-into{background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--accent)}
.list.drop-end{box-shadow:inset 0 -2px 0 0 var(--accent)}

.folder{display:flex;align-items:center;gap:4px;padding:4px 6px;margin-top:2px;border-radius:5px;
  cursor:pointer;color:var(--fg2);font-size:12px;user-select:none}
.folder:hover{background:var(--bg-hover)}
.folder .caret{width:12px;text-align:center;color:var(--fg3);font-size:9px;transition:transform .12s}
.folder[data-open="0"] .caret{transform:rotate(-90deg)}
.folder .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.folder .fcount{font-size:10px;color:var(--fg3);font-variant-numeric:tabular-nums}
.ftag{flex:none;font-size:9px;line-height:14px;padding:0 4px;border-radius:3px;color:var(--fg3);
  border:1px solid var(--line2);background:var(--bg)}
.folder .facts{display:none;gap:2px;flex:none}
.folder:hover .facts{display:flex}

.req{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:0;background:none;
  padding:5px 6px;border-radius:5px;cursor:pointer;color:var(--fg);min-width:0}
.req:hover{background:var(--bg-hover)}
.req[data-on="1"]{background:var(--accent-wash)}
.req[data-on="1"] .rname{color:var(--accent);font-weight:600}
.method{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:-.2px;flex:none;
  width:36px;line-height:14px;text-align:center;border-radius:3px;opacity:.95;
  border:1px solid color-mix(in srgb, currentColor 45%, transparent)}
.method[data-m="GET"]{color:var(--m-get)} .method[data-m="POST"]{color:var(--m-post)}
.method[data-m="PUT"]{color:var(--m-put)} .method[data-m="PATCH"]{color:var(--m-patch)}
.method[data-m="DELETE"]{color:var(--m-del)} .method[data-m="HEAD"],
.method[data-m="OPTIONS"]{color:var(--m-other)}
.rname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.rtag{flex:none;font-size:9.5px;color:var(--fg3);border:1px solid var(--line2);border-radius:9px;
  padding:0 5px;line-height:14px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.req .facts{display:none;gap:1px;flex:none}
.req:hover .facts,.req[data-on="1"] .facts{display:flex}
.fact{border:0;background:none;padding:2px 3px;border-radius:3px;color:var(--fg3);cursor:pointer;font-size:11px;line-height:1}
.fact:hover{background:var(--bg3);color:var(--fg)}
.fact.del:hover{color:var(--bad)}

.empty{display:flex;flex-direction:column;gap:10px;align-items:stretch;padding:22px 16px;text-align:center;
  color:var(--fg3);font-size:12px;line-height:1.7}
.empty b{color:var(--fg2);font-size:13px;display:block;margin-bottom:2px}
.empty .btns{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.empty kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line2);border-bottom-width:2px;
  border-radius:4px;padding:0 4px;background:var(--bg)}

/* ───────────────────────── 右侧 ───────────────────────── */
.pane{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.paneEmpty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;
  gap:8px;color:var(--fg3);font-size:12.5px;text-align:center}
.paneEmpty .big{font-size:34px;opacity:.28;margin-bottom:2px}

.reqHead{flex:none;padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.reqHead .row1{display:flex;align-items:center;gap:8px}
.nameInput{flex:1;min-width:0;height:30px;padding:0 9px;border:1px solid transparent;border-radius:var(--r);
  background:transparent;font-size:14px;font-weight:600;outline:none}
.nameInput:hover{border-color:var(--line2)}
.nameInput:focus{border-color:var(--accent);background:var(--bg);box-shadow:0 0 0 3px var(--accent-wash)}
.urlRow{display:flex;align-items:center;gap:6px;margin-top:8px}
.methodSel{height:34px;padding:0 6px;border-radius:var(--r);border:1px solid var(--line2);background:var(--bg);
  font-family:var(--mono);font-size:11.5px;font-weight:700;cursor:pointer;outline:none;flex:none}
.methodSel[data-m="GET"]{color:var(--m-get)} .methodSel[data-m="POST"]{color:var(--m-post)}
.methodSel[data-m="PUT"]{color:var(--m-put)} .methodSel[data-m="PATCH"]{color:var(--m-patch)}
.methodSel[data-m="DELETE"]{color:var(--m-del)}
.urlInput{flex:1;min-width:0;height:34px;padding:0 10px;border-radius:var(--r);border:1px solid var(--line2);
  background:var(--bg);font-family:var(--mono);font-size:12.5px;outline:none}
.urlInput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.urlInput::placeholder{color:var(--fg3);font-family:var(--sans)}
.sendBtn{height:34px;padding:0 18px;border-radius:var(--r);border:1px solid var(--accent);background:var(--accent);
  color:#fff;font-weight:600;cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:6px}
.sendBtn:hover:not(:disabled){background:var(--accent2)}
.sendBtn:disabled{opacity:.6;cursor:progress}
.urlHint{margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--fg3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urlHint b{color:var(--warn);font-weight:400}
.urlHint .ok{color:var(--fg3);cursor:copy}
.urlHint .ok:hover{color:var(--fg2);text-decoration:underline dotted}

.tabs{display:flex;align-items:center;gap:2px;padding:0 12px;flex:none;border-bottom:1px solid var(--line);
  background:var(--bg2);height:34px;overflow:auto}
.tab{border:0;background:none;padding:0 9px;height:33px;border-bottom:2px solid transparent;color:var(--fg2);
  cursor:pointer;font-size:12px;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[data-on="1"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab .cnt{font-size:10px;color:var(--fg3);margin-left:2px}
.tab .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:4px;vertical-align:middle}
.tab .dot.warn{background:var(--warn);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 22%,transparent)}
.warnText{color:var(--warn)}
.warnBox{display:flex;align-items:center;gap:10px;margin:0 0 8px;padding:7px 10px;border-radius:6px;
  font-size:11.5px;line-height:1.6;color:var(--warn);
  background:color-mix(in srgb,var(--warn) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 26%,transparent)}
.warnBox .grow{flex:1;min-width:0}
.warnBox .btn{flex:none;height:26px;font-size:11.5px}

.tabBody{flex:0 1 auto;max-height:44%;overflow:auto;padding:10px 16px 12px;min-height:74px}
.kvHead{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--fg3);padding:0 2px 4px;
  font-variant-numeric:tabular-nums}
.kvRow{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.kvRow input[type=checkbox]{flex:none;margin:0;accent-color:var(--accent);cursor:pointer}
.kvRow .k{flex:0 0 30%;min-width:70px} .kvRow .v{flex:1;min-width:70px}
.kvRow input[type=text],.kvRow textarea{height:27px;padding:0 8px;border-radius:5px;border:1px solid var(--line);
  background:var(--bg);font-family:var(--mono);font-size:11.5px;outline:none;min-width:0;width:100%}
.kvRow input[type=text]:focus,.kvRow textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-wash)}
.kvRow .del{flex:none;border:0;background:none;color:var(--fg3);cursor:pointer;padding:2px 4px;border-radius:4px;line-height:1}
.kvRow .del:hover{color:var(--bad);background:var(--bg3)}
.kvRow[data-off="1"] input[type=text]{opacity:.5;text-decoration:line-through}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field>label{font-size:11px;color:var(--fg3)}
.field input[type=text],.field input[type=password],.field select{height:30px;padding:0 9px;border-radius:var(--r);
  border:1px solid var(--line2);background:var(--bg);outline:none;font-family:var(--mono);font-size:12px}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.fieldRow{display:flex;gap:8px}
.fieldRow>*{flex:1;min-width:0}

.bodyTools{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;flex:none}
.seg button{border:0;background:none;padding:0 9px;height:25px;font-size:11.5px;color:var(--fg2);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[data-on="1"]{background:var(--accent-wash);color:var(--accent);font-weight:600}
.codeArea{width:100%;min-height:150px;resize:vertical;padding:9px 10px;border-radius:var(--r);
  border:1px solid var(--line2);background:var(--code-bg);font-family:var(--mono);font-size:12px;
  line-height:1.65;outline:none;white-space:pre;overflow:auto;tab-size:2}
.codeArea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.hint{font-size:11px;color:var(--fg3);line-height:1.7}
.hint.warn{color:var(--warn)}
.noteArea{width:100%;min-height:110px;resize:vertical;padding:9px 10px;border-radius:var(--r);
  border:1px solid var(--line2);background:var(--bg);font-size:12.5px;outline:none;line-height:1.7}
.noteArea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}

/* 响应区 */
.resp{flex:1;min-height:120px;display:flex;flex-direction:column;border-top:1px solid var(--line);min-width:0}
.pane.respFocus .tabBody{display:none}
.pane.respFocus .resp{min-height:0}
.respBar{display:flex;align-items:center;gap:8px;padding:0 12px;height:34px;flex:none;background:var(--bg2);
  border-bottom:1px solid var(--line);font-size:11.5px;color:var(--fg3);overflow:auto}
.status{font-family:var(--mono);font-weight:700;font-size:12px;padding:1px 6px;border-radius:4px}
.status[data-k="2"]{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.status[data-k="3"]{color:var(--info);background:color-mix(in srgb,var(--info) 12%,transparent)}
.status[data-k="4"]{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.status[data-k="5"]{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.status[data-k="0"]{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.meta{font-variant-numeric:tabular-nums;white-space:nowrap}
.via{font-size:10px;border:1px solid var(--line2);border-radius:9px;padding:0 6px;line-height:15px;white-space:nowrap}
.respBar .seg{margin-left:auto}
.respBar .seg button{height:24px}
.respBody{flex:1;min-height:0;overflow:auto;background:var(--code-bg)}
.respBody pre{margin:0;padding:12px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.7;
  white-space:pre-wrap;word-break:break-word;tab-size:2}
.respBody pre.plain{white-space:pre-wrap}
.respEmpty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--fg3);font-size:12px;
  flex-direction:column;gap:6px;background:var(--bg)}
.respErr{margin:12px 14px;padding:10px 12px;border-radius:var(--r);border-left:3px solid var(--bad);
  background:color-mix(in srgb,var(--bad) 8%,transparent);color:var(--bad);font-size:12px;line-height:1.7;white-space:pre-wrap}
.hdrTable{width:100%;border-collapse:collapse;font-size:11.5px}
.hdrTable td{padding:4px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-family:var(--mono);
  word-break:break-all}
.hdrTable td:first-child{color:var(--accent);width:34%;white-space:nowrap}
.j-k{color:var(--k)} .j-s{color:var(--s)} .j-n{color:var(--n)} .j-l{color:var(--l)}

/* 模态 */
.modalHost{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:rgba(9,13,20,.42);backdrop-filter:blur(1.5px);padding:24px}
.modalHost[hidden]{display:none}
.modal{width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column;background:var(--bg);
  border-radius:11px;border:1px solid var(--line2);box-shadow:0 18px 48px rgba(0,0,0,.28);overflow:hidden}
.modal.wide{width:min(760px,100%)}
.modalHead{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex:none}
.modalHead b{font-size:13.5px}
.modalHead .x{margin-left:auto;border:0;background:none;color:var(--fg3);cursor:pointer;font-size:16px;
  line-height:1;padding:3px 6px;border-radius:5px}
.modalHead .x:hover{background:var(--bg3);color:var(--fg)}
.modalBody{padding:14px 16px;overflow:auto;font-size:12.5px;line-height:1.75}
.modalFoot{display:flex;justify-content:flex-end;gap:8px;padding:11px 16px;border-top:1px solid var(--line);
  background:var(--bg2);flex:none}
.modalBody p{margin:0 0 8px}
.modalBody code{font-family:var(--mono);font-size:11.5px;background:var(--bg3);padding:1px 4px;border-radius:3px}
.modalBody .textInput{width:100%;height:32px;padding:0 9px;border-radius:var(--r);border:1px solid var(--line2);
  background:var(--bg);outline:none;font-family:var(--mono);font-size:12px}
.modalBody .textInput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.modalBody h4{margin:16px 0 6px;font-size:12px;color:var(--fg2);letter-spacing:.3px}
.modalBody h4:first-child{margin-top:0}
.modalBody ul{margin:6px 0;padding-left:18px}
.modalBody li{margin:3px 0}
.kbdList{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.kbdList kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line2);border-bottom-width:2px;
  border-radius:4px;padding:1px 5px;background:var(--bg2);white-space:nowrap;justify-self:start}
.pathBox{display:flex;align-items:center;gap:10px;margin:10px 0 6px;padding:8px 10px;border-radius:var(--r);
  border:1px solid var(--line2);background:var(--bg2)}
.pathBox code{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;background:none;padding:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.pathBox .btn{flex:none;height:26px;font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:24px;padding:0 9px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);
  color:var(--fg2);font:inherit;font-size:11px;cursor:pointer;max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}

/* Toast */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;
  flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{max-width:70vw;padding:8px 14px;border-radius:20px;background:#1f2733;color:#fff;font-size:12px;
  box-shadow:0 6px 22px rgba(0,0,0,.28);animation:tin .18s ease}
.toast.bad{background:#a1251c}
.toast.ok{background:#0b6b46}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.spin{display:inline-block;width:11px;height:11px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{flex:none;display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:11.5px;
  background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn);
  border-bottom:1px solid color-mix(in srgb,var(--warn) 24%,transparent)}

.banner button{border:1px solid currentColor;background:none;color:inherit;border-radius:5px;
  padding:2px 8px;cursor:pointer;font-size:11px}

<body>

      <button class="btn icon" id="btnVars" title="全局变量">{{ }}</button>

<script>
(function () {
'use strict';

/* ═══════════════════════════════════════════════════════════════════
   0. 常量与小工具
   ═══════════════════════════════════════════════════════════════════ */

const HUB_SCHEMA = 'api-hub/2';
const HOST_BASE = '/api-hub/api';
const LS_KEY = {
  path: 'apihub.dataPath',
  theme: 'apihub.theme',
  auto: 'apihub.autosave',
  open: 'apihub.openFolders',
  openCollections: 'apihub.openCollections',
  sel: 'apihub.selected',
  side: 'apihub.sideWidth'
};
const METHODS = ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'HEAD', 'OPTIONS'];
const MAX_BODY = 8 * 1024 * 1024;
const DEFAULT_TIMEOUT = 60;

const $ = (sel, root) => (root || document).querySelector(sel);

function uid(p) {
  return (p || 'x') + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
}
function nowIso() { return new Date().toISOString(); }
function str(v) { return v === null || v === undefined ? '' : String(v); }
function clamp(n, lo, hi) { return Math.min(Math.max(n, lo), hi); }

function addKids(el, kids) {
  for (const k of kids) {
    if (k === null || k === undefined || k === false || k === '') continue;
    if (Array.isArray(k)) addKids(el, k);
    else if (k instanceof Node) el.appendChild(k);
    else el.appendChild(document.createTextNode(String(k)));
  }
}
function h(tag, props) {
  const el = document.createElement(tag);
  if (props && typeof props === 'object') {
    for (const k in props) {
      const v = props[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'style') { if (typeof v === 'string') el.style.cssText = v; else Object.assign(el.style, v); }
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k === 'ref') { if (typeof v === 'function') v(el); }
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else if (k === 'disabled') el.disabled = !!v;
      else if (k === 'selected') el.selected = !!v;
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    }
  }
  for (let i = 2; i < arguments.length; i++) addKids(el, [arguments[i]]);
  return el;
}
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

function toast(msg, kind) {
  const box = $('#toasts');
  const node = h('div', { class: 'toast' + (kind ? ' ' + kind : '') , text: msg });
  box.appendChild(node);
  setTimeout(() => { node.style.transition = 'opacity .2s'; node.style.opacity = '0'; }, 2200);
  setTimeout(() => node.remove(), 2500);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (_) {
    try {
      const ta = h('textarea', { style: 'position:fixed;left:-9999px;top:0' });
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (__) { return false; }
  }
}

function downloadText(name, text) {
  const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: name });
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
}

function fmtBytes(n) {
  if (!Number.isFinite(n)) return '—';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
}
function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  const p = (x) => String(x).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ═══════════════════════════════════════════════════════════════════
   1. 数据模型
   ═══════════════════════════════════════════════════════════════════ */

function emptyHub() {
  return {
    schema: HUB_SCHEMA,
    name: '我的接口',
    variables: [],
    collections: [],
    folders: [],
    requests: [],
    createdAt: nowIso(),
    updatedAt: null
  };
}

function emptyCollection(patch) {
  return Object.assign({
    id: uid('c'),
    name: '新建集合',
    description: '',
    variables: [],
    createdAt: nowIso(),
    updatedAt: nowIso()
  }, patch || {});
}

const kv = (key, value) => ({ key: str(key), value: str(value), enabled: true });

function normalizeKvList(list) {
  return Array.isArray(list)
    ? list.filter((p) => p && typeof p === 'object').map((p) => ({
      key: str(p.key), value: str(p.value), enabled: p.enabled !== false
    }))
    : [];
}

function normalizeFormList(list) {
  return Array.isArray(list)
    ? list.filter((p) => p && typeof p === 'object').map((p) => ({
      id: str(p.id) || uid('row'),
      key: str(p.key),
      value: str(p.value),
      enabled: p.enabled !== false,
      type: p.type === 'file' ? 'file' : 'text',
      fileName: str(p.fileName),
      contentType: str(p.contentType)
    }))
    : [];
}

function emptyRequest(patch) {
  return Object.assign({
    id: uid('r'),
    name: '新建接口',
    collectionId: null,
    folderId: null,
    method: 'GET',
    url: '',
    params: [],
    headers: [],
    body: { mode: 'none', raw: '', language: 'json', form: [] },
    auth: { type: 'none', token: '', username: '', password: '', key: '', value: '', addTo: 'header' },
    note: '',
    timeout: 0,
    tlsInsecure: false,
    createdAt: nowIso(),
    updatedAt: nowIso()
  }, patch || {});
}

function normalizeRequest(raw, folderIds, pickCollection) {
  const r = emptyRequest();
  if (!raw || typeof raw !== 'object') return r;
  r.id = typeof raw.id === 'string' && raw.id ? raw.id : uid('r');
  r.name = str(raw.name) || '未命名接口';
  r.collectionId = typeof pickCollection === 'function' ? pickCollection(raw.collectionId) : str(raw.collectionId);
  r.folderId = raw.folderId && (!folderIds || folderIds.has(String(raw.folderId))) ? String(raw.folderId) : null;
  r.method = METHODS.indexOf(String(raw.method || '').toUpperCase()) >= 0 ? String(raw.method).toUpperCase() : 'GET';
  r.url = str(raw.url);
  r.params = normalizeKvList(raw.params);
  r.headers = normalizeKvList(raw.headers);
  const b = raw.body && typeof raw.body === 'object' ? raw.body : {};
  r.body = {
    mode: ['none', 'raw', 'urlencoded', 'formdata', 'graphql'].indexOf(b.mode) >= 0 ? b.mode : 'none',
    raw: str(b.raw),
    language: str(b.language) || 'json',
    form: normalizeFormList(b.form)
  };
  const a = raw.auth && typeof raw.auth === 'object' ? raw.auth : {};
  r.auth = {
    type: ['none', 'bearer', 'basic', 'apikey'].indexOf(a.type) >= 0 ? a.type : 'none',
    token: str(a.token), username: str(a.username), password: str(a.password),
    key: str(a.key), value: str(a.value), addTo: a.addTo === 'query' ? 'query' : 'header',
    inherit: a.inherit === true
  };
  r.note = str(raw.note);
  r.timeout = Number(raw.timeout) > 0 ? Number(raw.timeout) : 0;
  r.tlsInsecure = raw.tlsInsecure === true;
  r.createdAt = str(raw.createdAt) || nowIso();
  r.updatedAt = str(raw.updatedAt) || r.createdAt;
  return r;
}

/**
 * 一份数据文件装多个集合。
 * 读到的是老格式（没有 collections 字段）时，整体收进一个集合，不丢东西。
 */
function normalizeHub(raw) {
  const hub = emptyHub();
  if (!raw || typeof raw !== 'object') return hub;
  hub.name = str(raw.name) || hub.name;
  hub.createdAt = str(raw.createdAt) || hub.createdAt;
  hub.updatedAt = str(raw.updatedAt) || null;

  const collectionIds = new Set();
  for (const c of Array.isArray(raw.collections) ? raw.collections : []) {
    if (!c || typeof c !== 'object') continue;
    let id = str(c.id);
    if (!id || collectionIds.has(id)) id = uid('c');
    collectionIds.add(id);
    hub.collections.push({
      id: id,
      name: str(c.name) || '未命名集合',
      description: str(c.description),
      variables: normalizeKvList(c.variables),
      createdAt: str(c.createdAt) || nowIso(),
      updatedAt: str(c.updatedAt) || nowIso()
    });
  }
  if (!hub.collections.length) {
    hub.collections.push(emptyCollection({ name: str(raw.name) || '我的接口' }));
  }
  const defaultCid = hub.collections[0].id;
  const pickCollection = (cid) => (cid && collectionIds.has(str(cid)) ? str(cid) : defaultCid);

  const seen = new Set();
  const folders = Array.isArray(raw.folders) ? raw.folders : [];
  for (const f of folders) {
    if (!f || typeof f !== 'object') continue;
    let id = str(f.id);
    if (!id || seen.has(id)) id = uid('f');
    seen.add(id);
    hub.folders.push({
      id: id,
      name: str(f.name) || '未命名分组',
      parentId: null,
      parentRaw: str(f.parentId),
      collectionId: str(f.collectionId) ? pickCollection(f.collectionId) : ''
    });
  }
  for (const f of hub.folders) {
    f.parentId = f.parentRaw && seen.has(f.parentRaw) && f.parentRaw !== f.id ? f.parentRaw : null;
    delete f.parentRaw;
  }
  // 断开环形父子关系
  const byId = new Map(hub.folders.map((f) => [f.id, f]));
  for (const f of hub.folders) {
    let cur = f.parentId, guard = 0;
    while (cur && guard++ < 64) {
      if (cur === f.id) { f.parentId = null; break; }
      cur = (byId.get(cur) || {}).parentId || null;
    }
  }
  const reqs = Array.isArray(raw.requests) ? raw.requests : [];
  for (const r of reqs) hub.requests.push(normalizeRequest(r, seen, pickCollection));

  // 分组缺 collectionId 时，跟着它下面的接口走
  const folderCid = new Map();
  for (const r of hub.requests) {
    if (r.folderId && !folderCid.has(r.folderId)) folderCid.set(r.folderId, r.collectionId);
  }
  for (const f of hub.folders) {
    if (!f.collectionId) f.collectionId = folderCid.get(f.id) || defaultCid;
  }
  for (const r of hub.requests) {
    if (!r.collectionId) r.collectionId = defaultCid;
  }
  // 接口挂在别的集合的分组下面时，跟着分组走 —— 否则它在树上会看不见
  const folderById = new Map(hub.folders.map((f) => [f.id, f]));
  for (const r of hub.requests) {
    if (!r.folderId) continue;
    const folder = folderById.get(r.folderId);
    if (folder && folder.collectionId && folder.collectionId !== r.collectionId) {
      r.collectionId = folder.collectionId;
    }
  }

  hub.variables = normalizeKvList(raw.variables);
  return hub;
}

/* ═══════════════════════════════════════════════════════════════════
   2. Postman Collection v2.1 兼容
   ═══════════════════════════════════════════════════════════════════ */

function segText(x) {
  if (typeof x === 'string') return x;
  if (x && typeof x === 'object' && typeof x.value === 'string') return x.value;
  return '';
}

function postmanUrlText(url) {
  if (!url) return '';
  if (typeof url === 'string') return url;
  if (typeof url !== 'object') return '';
  if (typeof url.raw === 'string' && url.raw.trim()) return url.raw.trim();
  const proto = url.protocol ? String(url.protocol).replace(/:$/, '') + '://' : '';
  const host = Array.isArray(url.host) ? url.host.map(segText).join('.') : segText(url.host);
  const path = Array.isArray(url.path) ? url.path.map(segText).join('/') : segText(url.path);
  return proto + host + (path ? '/' + path : '');
}

function decodePart(s) {
  try { return decodeURIComponent(String(s).replace(/\+/g, ' ')); }
  catch (_) { return String(s); }
}

/** 把 `a=1&b=2` 拆成参数表；URL 里的 query 一律搬进参数表，发送时再拼回去。 */
function splitUrl(raw) {
  let s = str(raw).trim();
  const hashAt = s.indexOf('#');
  if (hashAt >= 0) s = s.slice(0, hashAt);
  const qAt = s.indexOf('?');
  if (qAt < 0) return { base: s, params: [] };
  const base = s.slice(0, qAt);
  const params = [];
  for (const part of s.slice(qAt + 1).split('&')) {
    if (!part) continue;
    const eq = part.indexOf('=');
    params.push({
      key: decodePart(eq < 0 ? part : part.slice(0, eq)),
      value: eq < 0 ? '' : decodePart(part.slice(eq + 1)),
      enabled: true
    });
  }
  return { base: base, params: params };
}

function postmanAuth(auth) {
  if (!auth || typeof auth !== 'object' || !auth.type || auth.type === 'noauth') return { type: 'none' };
  const list = Array.isArray(auth[auth.type]) ? auth[auth.type] : [];
  const get = (k) => {
    const hit = list.find((x) => x && x.key === k);
    return hit ? str(hit.value) : '';
  };
  if (auth.type === 'bearer') return { type: 'bearer', token: get('token') };
  if (auth.type === 'basic') return { type: 'basic', username: get('username'), password: get('password') };
  if (auth.type === 'apikey') {
    return { type: 'apikey', key: get('key'), value: get('value'), addTo: get('in') === 'query' ? 'query' : 'header' };
  }
  return { type: 'none' };
}

function postmanBody(body) {
  const out = { mode: 'none', raw: '', language: 'json', form: [] };
  if (!body || typeof body !== 'object') return out;
  if (body.mode === 'raw') {
    out.mode = 'raw';
    out.raw = str(body.raw);
    const lang = body.options && body.options.raw && body.options.raw.language;
    out.language = lang ? String(lang).toLowerCase() : guessLanguage(out.raw);
    return out;
  }
  if (body.mode === 'urlencoded') {
    out.mode = 'urlencoded';
    out.form = (Array.isArray(body.urlencoded) ? body.urlencoded : [])
      .filter((x) => x && typeof x === 'object')
      .map((x) => ({ id: uid('row'), key: str(x.key), value: str(x.value), enabled: x.disabled !== true, type: 'text' }));
    return out;
  }
  if (body.mode === 'formdata') {
    out.mode = 'formdata';
    out.form = (Array.isArray(body.formdata) ? body.formdata : [])
      .filter((x) => x && typeof x === 'object')
      .map((x) => ({
        id: uid('row'),
        key: str(x.key),
        value: str(x.value === undefined ? x.src : x.value),
        fileName: x.type === 'file' ? str(x.src || x.value).split(/[\\/]/).pop() : '',
        enabled: x.disabled !== true,
        type: x.type === 'file' ? 'file' : 'text'
      }));
    return out;
  }
  if (body.mode === 'graphql') {
    const g = body.graphql || {};
    let vars = {};
    try { vars = g.variables ? JSON.parse(g.variables) : {}; } catch (_) { vars = {}; }
    out.mode = 'raw';
    out.language = 'json';
    out.raw = JSON.stringify({ query: str(g.query), variables: vars }, null, 2);
    return out;
  }
  if (body.mode === 'file') {
    out.mode = 'none';
    out.raw = '';
    return out;
  }
  return out;
}

function guessLanguage(text) {
  const s = str(text).trim();
  if (!s) return 'json';
  if (/^[\[{]/.test(s)) {
    try { JSON.parse(s); return 'json'; } catch (_) { /* 继续猜 */ }
  }
  if (/^<\?xml|^<[a-zA-Z]/.test(s)) return 'html';
  return 'text';
}

function convertPostmanItem(item, folderId, inheritedAuth, out) {
  const req = item.request;
  const r = emptyRequest({ name: str(item.name) || '未命名接口', folderId: folderId });
  if (typeof req === 'string') {
    r.method = 'GET';
    const split = splitUrl(req);
    r.url = split.base;
    r.params = split.params;
    r.auth = Object.assign(r.auth, postmanAuth(inheritedAuth));
  } else if (req && typeof req === 'object') {
    r.method = req.method ? String(req.method).toUpperCase() : 'GET';
    if (METHODS.indexOf(r.method) < 0) r.method = 'GET';
    const text = postmanUrlText(req.url);
    const split = splitUrl(text);
    r.url = split.base;
    r.params = split.params;
    if (req.url && typeof req.url === 'object' && Array.isArray(req.url.query) && req.url.query.length) {
      // Postman 的 query 数组是权威来源（含 disabled 标记）
      r.params = req.url.query.filter((q) => q && typeof q === 'object').map((q) => ({
        key: str(q.key), value: str(q.value), enabled: q.disabled !== true
      }));
    }
    r.headers = (Array.isArray(req.header) ? req.header : [])
      .filter((x) => x && typeof x === 'object' && str(x.key) !== '')
      .map((x) => ({ key: str(x.key), value: str(x.value), enabled: x.disabled !== true }));
    r.body = postmanBody(req.body);
    const auth = postmanAuth(req.auth || inheritedAuth);
    r.auth = Object.assign(r.auth, auth);
    const desc = req.description;
    r.note = typeof desc === 'string' ? desc : (desc && typeof desc === 'object' ? str(desc.content) : '');
  }
  out.requests.push(r);
}

function walkPostmanItem(items, parentId, inheritedAuth, out) {
  if (!Array.isArray(items)) return;
  for (const item of items) {
    if (!item || typeof item !== 'object') continue;
    if (Array.isArray(item.item)) {
      const folder = { id: uid('f'), name: str(item.name) || '未命名分组', parentId: parentId };
      out.folders.push(folder);
      walkPostmanItem(item.item, folder.id, item.auth || inheritedAuth, out);
    } else if (item.request !== undefined) {
      convertPostmanItem(item, parentId, inheritedAuth, out);
    }
  }
}

function parsePostmanCollection(col) {
  const out = { name: '导入的集合', description: '', folders: [], requests: [], variables: [] };
  const root = col.collection && typeof col.collection === 'object' ? col.collection : col;
  const info = root.info || (col.info) || {};
  out.name = str(info.name) || str(root.name) || '导入的集合';
  const desc = info.description !== undefined ? info.description : root.description;
  out.description = typeof desc === 'string' ? desc : (desc && typeof desc === 'object' ? str(desc.content) : '');
  walkPostmanItem(root.item || root.requests || [], null, root.auth, out);
  const vars = Array.isArray(root.variable) ? root.variable : (Array.isArray(root.variables) ? root.variables : []);
  for (const v of vars) {
    if (!v || typeof v !== 'object') continue;
    out.variables.push({ key: str(v.key !== undefined ? v.key : v.id), value: str(v.value), enabled: v.disabled !== true });
  }
  return out;
}

function parsePostmanV1(col) {
  const out = { name: str(col.name) || '导入的集合', description: str(col.description), folders: [], requests: [], variables: [] };
  const folderMap = new Map();
  const folders = Array.isArray(col.folders) ? col.folders : [];
  for (const f of folders) {
    const folder = { id: uid('f'), name: str(f.name || f.id) || '未命名分组', parentId: null };
    folderMap.set(str(f.id || f.name), folder.id);
    out.folders.push(folder);
  }
  const reqs = Array.isArray(col.requests) ? col.requests : [];
  for (const q of reqs) {
    if (!q || typeof q !== 'object') continue;
    const r = emptyRequest({ name: str(q.name) || '未命名接口', folderId: folderMap.get(str(q.folder)) || null });
    r.method = METHODS.indexOf(String(q.method || 'GET').toUpperCase()) >= 0 ? String(q.method).toUpperCase() : 'GET';
    const split = splitUrl(postmanUrlText(q.url));
    r.url = split.base;
    r.params = split.params;
    r.headers = (Array.isArray(q.headers) ? q.headers : []).map((x) => ({
      key: str(x.key), value: str(x.value), enabled: x.enabled !== false
    }));
    if (q.dataMode === 'raw' || q.rawModeData) {
      r.body = { mode: 'raw', raw: str(q.rawModeData), language: guessLanguage(q.rawModeData), form: [] };
    } else if (q.dataMode === 'urlencoded' && Array.isArray(q.data)) {
      r.body = { mode: 'urlencoded', raw: '', language: 'json', form: q.data.map((x) => ({ key: str(x.key), value: str(x.value), enabled: x.enabled !== false, type: 'text' })) };
    }
    out.requests.push(r);
  }
  return out;
}

/** 是不是 API-HUB 自己的数据文件（认 v1 与 v2） */
function isHubFile(json) {
  if (!json || typeof json !== 'object' || Array.isArray(json)) return false;
  return /^api-hub\//.test(str(json.schema));
}

function detectFormat(json) {
  if (!json || typeof json !== 'object' || Array.isArray(json)) return 'unknown';
  if (isHubFile(json) || (Array.isArray(json.requests) && Array.isArray(json.folders) && !json.info)) return 'apihub';
  const schema = json.info && json.info.schema ? String(json.info.schema) : '';
  if (/collection\/v2/i.test(schema)) return 'postman21';
  if (json.info && Array.isArray(json.item)) return 'postman21';
  if (json.collection && Array.isArray(json.collection.item)) return 'postman21';
  if (Array.isArray(json.item) && (json.info || json.name)) return 'postman21';
  if (Array.isArray(json.requests) && !json.folders) return 'postman1';
  if (Array.isArray(json.values)) return 'postman-env';
  if (json.environment && Array.isArray(json.environment.values)) return 'postman-env';
  return 'unknown';
}

/** 导入结果里，哪些分组真的挂着新接口（祖先也算），避免落一堆空壳 */
function usedFoldersOf(parsed, requests) {
  const byId = new Map(parsed.folders.map((f) => [f.id, f]));
  const used = new Set();
  for (const r of requests) {
    let cur = r.folderId;
    let guard = 0;
    while (cur && !used.has(cur) && guard++ < 64) {
      used.add(cur);
      cur = (byId.get(cur) || {}).parentId || null;
    }
  }
  return used;
}

/** 把一个 Postman 集合整体建成数据文件里的一个集合 */
function buildCollection(hub, parsed, nameOverride) {
  const collection = emptyCollection({
    name: uniqueName(nameOverride || parsed.name || '导入的集合', new Set(hub.collections.map((c) => c.name))),
    description: parsed.description || '',
    variables: normalizeKvList(parsed.variables)
  });
  hub.collections.push(collection);

  const used = usedFoldersOf(parsed, parsed.requests);
  const folderIdMap = new Map();
  for (const f of parsed.folders) {
    if (!used.has(f.id)) continue;
    const parentId = f.parentId && folderIdMap.has(f.parentId) ? folderIdMap.get(f.parentId) : null;
    const id = uid('f');
    hub.folders.push({ id: id, collectionId: collection.id, name: f.name, parentId: parentId });
    folderIdMap.set(f.id, id);
  }
  for (const r of parsed.requests) {
    const folderId = r.folderId && folderIdMap.has(r.folderId) ? folderIdMap.get(r.folderId) : null;
    hub.requests.push(Object.assign({}, r, {
      id: uid('r'), collectionId: collection.id, folderId: folderId, createdAt: nowIso(), updatedAt: nowIso()
    }));
  }
  return collection;
}

/**
 * 把导入结果并进一个已有集合。
 * 先按「方法 + 地址 + 名字」去重，再按分组名复用已有的分组 —— 重复导入不会长出空壳。
 * @returns {{added:number, skipped:number}}
 */
function mergeIntoCollection(hub, collectionId, parsed) {
  const fingerprint = new Set(
    hub.requests.filter((r) => r.collectionId === collectionId).map((r) => r.method + ' ' + r.url + ' ' + r.name)
  );
  const fresh = [];
  let skipped = 0;
  for (const r of parsed.requests) {
    const fp = r.method + ' ' + r.url + ' ' + r.name;
    if (fingerprint.has(fp)) { skipped++; continue; }
    fingerprint.add(fp);
    fresh.push(r);
  }

  const collection = hub.collections.find((c) => c.id === collectionId);
  if (collection) {
    for (const v of parsed.variables) {
      if (!v.key) continue;
      if (!collection.variables.some((x) => x.key === v.key)) {
        collection.variables.push({ key: v.key, value: v.value, enabled: v.enabled !== false });
      }
    }
  }

  if (!fresh.length) return { added: 0, skipped: skipped };

  const used = usedFoldersOf(parsed, fresh);
  const folderIdMap = new Map();
  for (const f of parsed.folders) {
    if (!used.has(f.id)) continue;
    const parentId = f.parentId && folderIdMap.has(f.parentId) ? folderIdMap.get(f.parentId) : null;
    const hit = hub.folders.find((x) =>
      x.collectionId === collectionId && x.name === f.name && str(x.parentId) === str(parentId));
    if (hit) { folderIdMap.set(f.id, hit.id); continue; }
    const id = uid('f');
    hub.folders.push({ id: id, collectionId: collectionId, name: f.name, parentId: parentId });
    folderIdMap.set(f.id, id);
  }

  let added = 0;
  for (const r of fresh) {
    const folderId = r.folderId && folderIdMap.has(r.folderId) ? folderIdMap.get(r.folderId) : null;
    hub.requests.push(Object.assign({}, r, {
      id: uid('r'), collectionId: collectionId, folderId: folderId, createdAt: nowIso(), updatedAt: nowIso()
    }));
    added++;
  }
  return { added: added, skipped: skipped };
}

/** 把一份 API-HUB JSON（可能是老的、也可能多集合）并进当前数据 */
function importHubData(hub, source) {
  const incoming = normalizeHub(source);
  let added = 0;
  for (const col of incoming.collections) {
    const collection = emptyCollection({
      name: uniqueName(col.name, new Set(hub.collections.map((c) => c.name))),
      description: col.description,
      variables: col.variables
    });
    hub.collections.push(collection);
    const srcFolders = incoming.folders.filter((f) => f.collectionId === col.id);
    const folderIdMap = new Map();
    let guard = 0;
    while (folderIdMap.size < srcFolders.length && guard++ < 200) {
      for (const f of srcFolders) {
        if (folderIdMap.has(f.id)) continue;
        const parentId = f.parentId ? (folderIdMap.get(f.parentId) || null) : null;
        if (f.parentId && !folderIdMap.has(f.parentId)) continue;
        const id = uid('f');
        hub.folders.push({ id: id, collectionId: collection.id, name: f.name, parentId: parentId });
        folderIdMap.set(f.id, id);
      }
    }
    for (const r of incoming.requests.filter((x) => x.collectionId === col.id)) {
      hub.requests.push(Object.assign({}, r, {
        id: uid('r'),
        collectionId: collection.id,
        folderId: r.folderId ? (folderIdMap.get(r.folderId) || null) : null,
        createdAt: nowIso(),
        updatedAt: nowIso()
      }));
      added++;
    }
  }
  return { added: added, collections: incoming.collections.length };
}

function uniqueName(base, taken) {
  let name = base, i = 2;
  while (taken.has(name)) name = base + ' ' + i++;
  return name;
}

/** 导出为 Postman Collection v2.1；给了 collectionId 就只导那一个集合 */
function toPostman(hub, collectionId) {
  const scope = collectionId ? hub.collections.filter((c) => c.id === collectionId) : hub.collections;
  const scopeIds = new Set(scope.map((c) => c.id));
  const foldersIn = hub.folders.filter((f) => scopeIds.has(f.collectionId));
  const requestsIn = hub.requests.filter((r) => scopeIds.has(r.collectionId) && (!r.folderId || foldersIn.some((f) => f.id === r.folderId)));
  const childrenOf = (pid) => ({
    folders: foldersIn.filter((f) => str(f.parentId) === str(pid)),
    requests: requestsIn.filter((r) => str(r.folderId) === str(pid))
  });
  const reqItem = (r) => {
    const header = r.headers.filter((x) => x.key).map((x) => ({ key: x.key, value: x.value, disabled: !x.enabled }));
    const query = r.params.filter((x) => x.key).map((x) => ({ key: x.key, value: x.value, disabled: !x.enabled }));
    const url = { raw: r.url + (query.filter((q) => !q.disabled).length
      ? '?' + query.filter((q) => !q.disabled).map((q) => encodeURIComponent(q.key) + '=' + encodeURIComponent(q.value)).join('&')
      : ''), query: query };
    const request = { method: r.method, header: header, url: url };
    if (r.body.mode === 'raw') {
      request.body = { mode: 'raw', raw: r.body.raw, options: { raw: { language: r.body.language || 'json' } } };
    } else if (r.body.mode === 'urlencoded') {
      request.body = { mode: 'urlencoded', urlencoded: r.body.form.map((x) => ({ key: x.key, value: x.value, disabled: !x.enabled })) };
    } else if (r.body.mode === 'formdata') {
      request.body = {
        mode: 'formdata',
        formdata: r.body.form.map((x) => ({
          key: x.key,
          value: x.type === 'file' ? undefined : x.value,
          src: x.type === 'file' ? (x.fileName || '') : undefined,
          type: x.type === 'file' ? 'file' : 'text',
          disabled: !x.enabled
        }))
      };
    }
    if (r.auth && r.auth.type === 'bearer') request.auth = { type: 'bearer', bearer: [{ key: 'token', value: r.auth.token, type: 'string' }] };
    if (r.auth && r.auth.type === 'basic') request.auth = { type: 'basic', basic: [{ key: 'username', value: r.auth.username }, { key: 'password', value: r.auth.password }] };
    if (r.auth && r.auth.type === 'apikey') request.auth = { type: 'apikey', apikey: [{ key: 'key', value: r.auth.key }, { key: 'value', value: r.auth.value }, { key: 'in', value: r.auth.addTo }] };
    if (r.note) request.description = r.note;
    return { name: r.name, request: request };
  };
  const build = (pid) => {
    const kids = childrenOf(pid);
    const rows = [];
    for (const f of kids.folders) rows.push({ name: f.name, item: build(f.id) });
    for (const r of kids.requests) rows.push(reqItem(r));
    return rows;
  };
  const items = [];
  if (collectionId) {
    items.push.apply(items, build(null));
  } else {
    // 全量导出：每个集合包成一个顶层分组，还是一个合法的 Collection 文件
    for (const c of scope) {
      const rows = [];
      const walk = (pid) => {
        const kids = { folders: foldersIn.filter((f) => str(f.parentId) === str(pid) && f.collectionId === c.id),
          requests: requestsIn.filter((r) => str(r.folderId) === str(pid) && r.collectionId === c.id) };
        const out = [];
        for (const f of kids.folders) out.push({ name: f.name, item: walk(f.id) });
        for (const r of kids.requests) out.push(reqItem(r));
        return out;
      };
      rows.push.apply(rows, walk(null));
      items.push({ name: c.name, item: rows });
    }
  }
  const variables = collectionId
    ? (scope[0] ? scope[0].variables : [])
    : hub.variables;
  return {
    info: {
      _postman_id: uid('pm'),
      name: collectionId && scope[0] ? scope[0].name : (hub.name || 'API-HUB 导出'),
      schema: 'https://schema.getpostman.com/json/collection/v2.1.0/collection.json'
    },
    item: items,
    variable: variables.filter((v) => v.key).map((v) => ({ key: v.key, value: v.value, type: 'string' }))
  };
}

/* ═══════════════════════════════════════════════════════════════════
   3. 变量与请求组装
   ═══════════════════════════════════════════════════════════════════ */

function varMap(hub, collectionId) {
  const map = {};
  for (const v of hub.variables) if (v.enabled !== false && v.key) map[v.key] = v.value;
  const collection = hub.collections.find((c) => c.id === collectionId);
  if (collection) {
    for (const v of collection.variables || []) {
      if (v.enabled !== false && v.key) map[v.key] = v.value;
    }
  }
  return map;
}

function dynamic(name) {
  if (name === '$timestamp') return String(Math.floor(Date.now() / 1000));
  if (name === '$isoTimestamp') return nowIso();
  if (name === '$guid') {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
      const r = (Math.random() * 16) | 0;
      return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
    });
  }
  if (name === '$randomInt') return String(Math.floor(Math.random() * 1000));
  return undefined;
}

/** 替换 {{var}}；返回文本 + 未解析的变量名 */
function resolveVars(text, vars) {
  const missing = [];
  const out = str(text).replace(/\{\{\s*([^{}\s]+)\s*\}\}/g, (whole, name) => {
    if (Object.prototype.hasOwnProperty.call(vars, name)) return String(vars[name]);
    const dyn = dynamic(name);
    if (dyn !== undefined) return dyn;
    if (missing.indexOf(name) < 0) missing.push(name);
    return whole;
  });
  return { text: out, missing: missing };
}

function hasHeader(headers, name) {
  const lower = name.toLowerCase();
  return Object.keys(headers).some((k) => k.toLowerCase() === lower);
}

function b64(text) {
  const bytes = new TextEncoder().encode(text);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}

const CT_BY_LANG = { json: 'application/json', xml: 'application/xml', html: 'text/html', text: 'text/plain', javascript: 'application/javascript' };

/** 组装最终请求：解析变量 → 拼 URL → 头 → 体 → 认证 */
function prepare(req, hub) {
  // 集合变量盖过全局变量
  const vars = varMap(hub, req.collectionId);
  const missing = [];
  const take = (txt) => {
    const r = resolveVars(txt, vars);
    for (const m of r.missing) if (missing.indexOf(m) < 0) missing.push(m);
    return r.text;
  };

  let base = take(req.url).trim();
  if (base && !/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(base)) {
    // 相对地址：补上默认协议，方便只写 host/path
    if (/^[\w.-]+(:\d+)?(\/|$)/.test(base)) base = 'http://' + base;
  }

  const pairs = [];
  for (const p of req.params) {
    if (!p.key || p.enabled === false) continue;
    pairs.push([take(p.key), take(p.value)]);
  }

  const headers = {};
  for (const hd of req.headers) {
    if (!hd.key || hd.enabled === false) continue;
    const name = take(hd.key).trim();
    if (!name) continue;
    headers[name] = take(hd.value);
  }

  // 认证
  const auth = req.auth || { type: 'none' };
  if (auth.type === 'bearer' && auth.token) {
    if (!hasHeader(headers, 'authorization')) headers['Authorization'] = 'Bearer ' + take(auth.token);
  } else if (auth.type === 'basic') {
    if (!hasHeader(headers, 'authorization')) {
      headers['Authorization'] = 'Basic ' + b64(take(auth.username) + ':' + take(auth.password));
    }
  } else if (auth.type === 'apikey' && auth.key) {
    if (auth.addTo === 'query') pairs.push([take(auth.key), take(auth.value)]);
    else if (!hasHeader(headers, auth.key)) headers[take(auth.key)] = take(auth.value);
  }

  // 请求体
  let body = null;
  let multipart = null;
  const mode = req.body.mode;
  if (mode === 'raw' || mode === 'graphql') {
    body = take(req.body.raw);
    if (!hasHeader(headers, 'content-type')) {
      const ct = CT_BY_LANG[req.body.language] || 'text/plain';
      headers['Content-Type'] = ct;
    }
  } else if (mode === 'urlencoded') {
    body = req.body.form
      .filter((x) => x.key && x.enabled !== false)
      .map((x) => encodeURIComponent(take(x.key)) + '=' + encodeURIComponent(take(x.value)))
      .join('&');
    if (!hasHeader(headers, 'content-type')) headers['Content-Type'] = 'application/x-www-form-urlencoded';
  } else if (mode === 'formdata') {
    // 谁发谁拼：本机代理按 parts 拼字节流，浏览器用 FormData
    const parts = [];
    for (const row of req.body.form) {
      if (!row.key || row.enabled === false) continue;
      if (row.type === 'file') {
        const file = state.formFiles.get(row.id) || null;
        parts.push({
          type: 'file',
          name: take(row.key),
          file: file,
          fileName: file ? file.name : (row.fileName || ''),
          contentType: (file && file.type) || row.contentType || 'application/octet-stream',
          missing: !file
        });
      } else {
        parts.push({ type: 'text', name: take(row.key), value: take(row.value) });
      }
    }
    multipart = {
      boundary: '----ApiHubBoundary' + Math.random().toString(16).slice(2, 12),
      parts: parts
    };
    if (!hasHeader(headers, 'content-type')) {
      headers['Content-Type'] = 'multipart/form-data; boundary=' + multipart.boundary;
    }
  }

  if (body !== null && (req.method === 'GET' || req.method === 'HEAD') && !body) body = null;

  let url = base;
  if (pairs.length) {
    const qs = pairs.map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
    url = (base.indexOf('?') >= 0 ? base + '&' : base + '?') + qs;
  }

  return {
    method: req.method,
    url: url,
    headers: headers,
    body: body,
    multipart: multipart,
    missing: missing,
    timeoutMs: (req.timeout > 0 ? req.timeout : DEFAULT_TIMEOUT) * 1000,
    tlsInsecure: req.tlsInsecure === true
  };
}

/* ═══════════════════════════════════════════════════════════════════
   4. 状态
   ═══════════════════════════════════════════════════════════════════ */

const state = {
  mode: 'file',            // 'file' | 'host'
  hostInfo: null,
  fileHandle: null,        // FileSystemFileHandle
  dataPath: '',            // host 模式下的绝对路径 / file 模式下的显示名
  data: emptyHub(),
  loaded: false,           // 是否绑定过真实存储
  dirty: false,
  saving: false,
  autoSave: true,
  readOnlyBlock: false,    // 读文件失败后暂停写盘，避免覆盖
  selectedId: null,
  tab: 'params',
  respTab: 'body',
  respView: 'tree',        // 'tree' | 'raw'
  query: '',
  response: null,
  sending: false,
  abort: null,
  openFolders: {},
  openCollections: {},
  lastCollectionId: '',
  theme: 'auto',
  respFocus: false,
  formFiles: new Map()     // 表单里选中的文件：rowId -> File（不进 JSON，只活在这次会话里）
};

function currentRequest() {
  return state.data.requests.find((r) => r.id === state.selectedId) || null;
}

function markDirty() {
  state.data.updatedAt = nowIso();
  const req = currentRequest();
  if (req) req.updatedAt = nowIso();
  if (!state.dirty) {
    state.dirty = true;
    paintDirty();
  }
  // 改参数 / 认证 / 地址都会影响最终 URL，顺手把那行提示刷新掉
  if (state.ui && state.ui.paintUrlHint) state.ui.paintUrlHint();
  if (state.autoSave) scheduleSave();
}

let saveTimer = 0;
function scheduleSave() {
  if (state.saving || state.readOnlyBlock) return;
  if (!canSave()) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { void saveNow(true); }, 1200);
}

function canSave() {
  if (state.mode === 'host') return !!state.dataPath;
  return !!state.fileHandle;
}

function paintDirty() {
  const label = $('#pathLabel');
  const base = state.dataPath || (state.mode === 'host' ? '（未选择数据文件）' : '未绑定文件');
  label.textContent = (state.dirty ? '● ' : '') + base;
  label.dataset.dirty = state.dirty ? '1' : '0';
  label.title = base + (state.dirty ? '\n有未保存的修改' : '') + '\n点这里换数据文件位置';
}

/* ═══════════════════════════════════════════════════════════════════
   5. 存储
   ═══════════════════════════════════════════════════════════════════ */

async function hostFetch(path, body, method, signal) {
  const res = await fetch(HOST_BASE + path, {
    method: method || 'GET',
    headers: body ? { 'content-type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
    cache: 'no-store',
    credentials: 'same-origin',
    signal: signal
  });
  const text = await res.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch (_) { json = null; }
  if (!json) throw new Error('接口返回异常（HTTP ' + res.status + '）：' + text.slice(0, 200));
  if (!json.ok) throw new Error(json.error || '接口失败');
  return json.data;
}

async function detectHost() {
  const qs = new URLSearchParams(location.search);
  const force = qs.get('mode');
  if (force === 'file' || force === 'standalone') return null;
  if (location.protocol === 'file:') return null;
  if (force === 'host') {
    try { return await hostFetch('/status'); } catch (_) { return null; }
  }
  try {
    const info = await hostFetch('/status');
    if (info && info.mode === 'dsh') return info;
  } catch (_) { /* 普通静态服务器上没有这个接口，走单网页模式 */ }
  return null;
}

async function bootHost(info) {
  state.mode = 'host';
  state.hostInfo = info;
  $('#modeTag').textContent = '插件模式 · 本机代理';
  let saved = '';
  try { saved = localStorage.getItem(LS_KEY.path) || ''; } catch (_) { /* 忽略 */ }
  const path = saved || info.dataFile || '';
  await loadHostPath(path);
}

/** 只给个目录（或没写 .json）时，自动补成 <目录>/api-hub.json */
function normalizeDataPath(raw) {
  let value = String(raw || '').trim().replace(/^"|"$/g, '');
  if (!value) return '';
  if (/\.json$/i.test(value)) return value;
  value = value.replace(/[\\/]+$/, '');
  if (!value) return '';
  return value + '\\api-hub.json';
}

/**
 * 打开/切换数据文件。
 * @param {string} path
 * @param {{ask?: boolean}} [opts] ask=true 时，目标不存在会先问「新建空白 / 把当前数据搬过去」
 */
async function loadHostPath(path, opts) {
  if (!path) { toast('没有可用的数据文件路径', 'bad'); return false; }
  const ask = opts && opts.ask === true;
  try {
    const res = await hostFetch('/open', { path: path }, 'POST');

    // 换了个文件：先把没落盘的改动存回「原文件」，别丢
    if (state.dirty && state.dataPath && state.dataPath !== res.path && !state.readOnlyBlock) {
      await saveNow(true);
    }

    if (!res.exists && ask) {
      const hasData = state.data.requests.length > 0;
      const choice = await modal({
        title: '这个文件还不存在',
        body: h('div', null,
          h('p', null, '路径：', h('code', null, res.path)),
          hasData
            ? h('p', null, '要把它建成空文件，还是把当前这 ' + state.data.requests.length + ' 个接口一并写过去？')
            : h('p', null, '可以现在建，之后保存会自动写到这个文件。')),
        actions: hasData
          ? [
            { label: '取消', value: null },
            { label: '新建空白', value: 'blank' },
            { label: '把当前数据写过去', primary: true, value: 'move' }
          ]
          : [{ label: '取消', value: null }, { label: '好，就放这儿', primary: true, value: 'blank' }]
      });
      if (!choice) return false;
      if (choice === 'move') {
        state.dataPath = res.path;
        try { localStorage.setItem(LS_KEY.path, res.path); } catch (_) { /* 忽略 */ }
        state.loaded = true;
        state.readOnlyBlock = false;
        await saveNow(false);
        paintDirty();
        renderSidebar();
        renderEditor();
        return true;
      }
    }

    state.dataPath = res.path;
    try { localStorage.setItem(LS_KEY.path, res.path); } catch (_) { /* 忽略 */ }
    pushRecentPath(res.path);
    if (res.exists && res.data) {
      state.data = normalizeHub(res.data);
      state.readOnlyBlock = false;
      state.loaded = true;
      state.dirty = false;
      toast('已加载 ' + shortPath(res.path) + '（' + state.data.collections.length + ' 个集合 / ' +
        state.data.requests.length + ' 个接口）', 'ok');
    } else if (res.exists && !res.data) {
      state.data = emptyHub();
      state.readOnlyBlock = true;
      state.loaded = true;
      state.dirty = false;
      toast('数据文件不是合法 JSON，已暂停写盘', 'bad');
    } else {
      state.data = emptyHub();
      state.readOnlyBlock = false;
      state.loaded = true;
      state.dirty = false;
      toast('新位置已就绪，下次改动会写进 ' + shortPath(res.path));
    }
    restoreSelection();
    paintDirty();
    renderSidebar();
    renderEditor();
    if (res.exists && !res.data) showCorruptBanner(res.path);
    return true;
  } catch (err) {
    toast('读取失败：' + err.message, 'bad');
    return false;
  }
}

/** 上次看的是哪个接口，回来还看那个 */
function restoreSelection() {  if (state.selectedId && currentRequest()) return;
  let saved = '';
  try { saved = localStorage.getItem(LS_KEY.sel) || ''; } catch (_) { /* 忽略 */ }
  state.selectedId = saved && state.data.requests.some((r) => r.id === saved) ? saved : null;
}

function shortPath(p) {
  if (!p) return '';
  const parts = String(p).split(/[\\/]/);
  return parts.length <= 2 ? p : '…/' + parts.slice(-2).join('/');
}

function showCorruptBanner(path) {
  if ($('.banner')) return;
  const banner = h('div', { class: 'banner' },
    '数据文件解析失败，为免覆盖已暂停自动写盘。',
    h('span', { class: 'grow' }),
    h('button', {
      onclick: () => {
        state.readOnlyBlock = false;
        markDirty();
        void saveNow(false);
        banner.remove();
      }
    }, '仍然覆盖写入'),
    h('button', { onclick: () => banner.remove() }, '忽略')
  );
  const app = $('.app');
  const main = $('.main');
  if (app && main) app.insertBefore(banner, main);
}

async function saveNow(silent) {
  if (state.readOnlyBlock) { if (!silent) toast('已暂停写盘，请先处理解析失败的提示', 'bad'); return; }
  if (state.saving) return;
  state.saving = true;
  try {
    const payload = JSON.parse(JSON.stringify(state.data));
    if (state.mode === 'host') {
      if (!state.dataPath) {
        const path = await askDataPath(state.hostInfo ? state.hostInfo.dataFile : '');
        if (!path) return;
        state.dataPath = path;
      }
      const res = await hostFetch('/save', { path: state.dataPath, data: payload }, 'POST');
      state.dataPath = res.path;
      try { localStorage.setItem(LS_KEY.path, res.path); } catch (_) { /* 忽略 */ }
      state.dirty = false;
      paintDirty();
      if (!silent) toast('已保存到 ' + shortPath(res.path), 'ok');
      return;
    }
    // 浏览器文件模式
    const json = JSON.stringify(payload, null, 2);
    if (!state.fileHandle) {
      const got = await askSaveHandle(json);
      if (!got) return;
      state.dirty = false;
      paintDirty();
      return;
    }
    const writable = await state.fileHandle.createWritable();
    await writable.write(json);
    await writable.close();
    state.dirty = false;
    paintDirty();
    if (!silent) toast('已保存', 'ok');
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    toast('保存失败：' + (err && err.message ? err.message : err), 'bad');
  } finally {
    state.saving = false;
  }
}

async function askSaveHandle(json) {
  if (!window.showSaveFilePicker) {
    downloadText((state.data.name || 'api-hub') + '.json', json);
    toast('当前浏览器不支持直接写文件，已改为下载', 'bad');
    return false;
  }
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: (state.data.name || 'api-hub') + '.json',
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
    });
    const writable = await handle.createWritable();
    await writable.write(json);
    await writable.close();
    state.fileHandle = handle;
    state.dataPath = handle.name;
    state.loaded = true;
    paintDirty();
    toast('已保存到 ' + handle.name, 'ok');
    return true;
  } catch (err) {
    if (err && err.name === 'AbortError') return false;
    // 退回下载
    downloadText((state.data.name || 'api-hub') + '.json', json);
    toast('写文件失败，已改为下载：' + (err && err.message ? err.message : err), 'bad');
    return false;
  }
}

async function openLocalFile() {
  if (window.showOpenFilePicker) {
    let handle;
    try {
      const picked = await window.showOpenFilePicker({
        multiple: false,
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
      });
      handle = picked[0];
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      return openViaInput();
    }
    const file = await handle.getFile();
    const text = await file.text();
    adoptFile(handle, file.name, text);
    return;
  }
  openViaInput();
}

function openViaInput() {
  const input = $('#fileInput');
  input.value = '';
  input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const text = await file.text();
    adoptFile(null, file.name, text);
  };
  input.click();
}

/**
 * 打开一个本地 JSON：
 *   · API-HUB 数据文件（v1/v2）→ 整个接管
 *   · Postman 集合 / 环境变量 → 并进当前数据（不破坏已有内容）
 */
async function adoptFile(handle, name, text) {
  let json;
  try { json = JSON.parse(text); }
  catch (err) {
    toast('JSON 解析失败：' + err.message, 'bad');
    return false;
  }

  if (isHubFile(json)) {
    state.data = normalizeHub(json);
    state.dataPath = name;
    state.loaded = true;
    state.dirty = false;
    state.readOnlyBlock = false;
    restoreSelection();
    state.fileHandle = handle || null;
    if (!handle) state.dirty = true;
    paintDirty();
    renderSidebar();
    renderEditor();
    toast('已打开 ' + name + '（' + state.data.collections.length + ' 个集合 / ' +
      state.data.requests.length + ' 个接口）', 'ok');
    return true;
  }

  // 不是数据文件：当成导入
  const kind = detectFormat(json);
  if (kind === 'unknown') {
    toast('认不出这个 JSON：既不是 API-HUB 数据文件，也不是 Postman 集合', 'bad');
    return false;
  }
  const before = state.data.requests.length;
  await doImport(json);
  state.loaded = true;
  if (!handle) {
    // 拖进来/选进来的导入内容还没有落盘位置
    state.dirty = true;
    paintDirty();
  }
  const added = state.data.requests.length - before;
  if (!added && kind !== 'postman-env') {
    toast('「' + name + '」里没有新接口', undefined);
  } else if (state.mode === 'file' && !state.fileHandle) {
    toast('导入内容还没落盘，点「保存」选个位置', undefined);
  }
  return true;
}

/* ═══════════════════════════════════════════════════════════════════
   6. 发送请求
   ═══════════════════════════════════════════════════════════════════ */

function corsHint(err) {
  const msg = (err && err.message) || String(err);
  if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) {
    return '网络不可达，或被浏览器的跨域（CORS）策略拦下了。\n'
      + '· 单网页模式：浏览器直连，目标服务必须允许跨域；可用 --disable-web-security 启动 Chrome。\n'
      + '· 想彻底绕开跨域：装成 DeepSeek Harness 的 API-HUB 插件，由本机代理发送。\n'
      + '· 也确认一下地址、端口、协议（http/https）是否写对。';
  }
  return msg;
}

/** 浏览器这一侧用 FormData 拼，文件由浏览器自己读 —— 不要手动设 Content-Type */
function buildFormData(prep) {
  const fd = new FormData();
  const skipped = [];
  for (const part of prep.multipart.parts) {
    if (part.type === 'file') {
      if (part.file) fd.append(part.name, part.file, part.fileName || part.file.name);
      else skipped.push(part.name);
    } else {
      fd.append(part.name, part.value);
    }
  }
  return { fd, skipped };
}

async function sendStandalone(prep, signal) {
  const init = {
    method: prep.method,
    headers: Object.assign({}, prep.headers),
    signal: signal,
    mode: 'cors',
    credentials: 'omit',
    redirect: 'follow',
    cache: 'no-store'
  };
  if (prep.multipart && prep.method !== 'GET' && prep.method !== 'HEAD') {
    const built = buildFormData(prep);
    init.body = built.fd;
    // 浏览器要自己加 boundary，手动设的 multipart Content-Type 会把它带歪
    for (const key of Object.keys(init.headers)) {
      if (key.toLowerCase() === 'content-type') delete init.headers[key];
    }
    prep.skippedFiles = built.skipped;
  } else if (prep.body !== null && prep.method !== 'GET' && prep.method !== 'HEAD') {
    init.body = prep.body;
  }
  const startedAt = performance.now();
  let res;
  try {
    res = await fetch(prep.url, init);
  } catch (err) {
    if (err && (err.name === 'AbortError')) throw err;
    const e = new Error(corsHint(err));
    e.timeMs = Math.round(performance.now() - startedAt);
    throw e;
  }
  const raw = await res.text();
  const timeMs = Math.round(performance.now() - startedAt);
  const headers = [];
  res.headers.forEach((v, k) => headers.push([k, v]));
  return {
    status: res.status,
    statusText: res.statusText,
    headers: headers,
    body: raw,
    timeMs: timeMs,
    size: new Blob([raw]).size,
    via: '浏览器直连',
    type: res.type,
    url: res.url || prep.url
  };
}

/** 文件要过 JSON 这一关，只能 base64；单文件上限放在 40MB，够日常传图传包 */
const MAX_UPLOAD_BYTES = 40 * 1024 * 1024;

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = String(reader.result || '');
      const comma = result.indexOf(',');
      resolve(comma >= 0 ? result.slice(comma + 1) : result);
    };
    reader.onerror = () => reject(reader.error || new Error('读取文件失败'));
    reader.readAsDataURL(file);
  });
}

async function sendHost(prep, signal) {
  let multipart = null;
  if (prep.multipart) {
    const parts = [];
    for (const part of prep.multipart.parts) {
      if (part.type === 'file') {
        if (!part.file) continue;
        if (part.file.size > MAX_UPLOAD_BYTES) {
          throw new Error('文件太大：' + part.fileName + '（上限 40MB）');
        }
        parts.push({
          type: 'file',
          name: part.name,
          fileName: part.fileName,
          contentType: part.contentType,
          base64: await fileToBase64(part.file)
        });
      } else {
        parts.push({ type: 'text', name: part.name, value: part.value });
      }
    }
    multipart = { boundary: prep.multipart.boundary, parts: parts };
  }
  const data = await hostFetch('/send', {
    method: prep.method,
    url: prep.url,
    headers: prep.headers,
    body: prep.body,
    multipart: multipart,
    timeoutMs: prep.timeoutMs,
    tlsInsecure: prep.tlsInsecure
  }, 'POST', signal);
  return Object.assign({}, data, { via: '本机代理' });
}

async function doSend() {
  const req = currentRequest();
  if (!req) return;
  if (state.sending) return;
  if (!str(req.url).trim()) { toast('先填一个地址', 'bad'); return; }
  const prep = prepare(req, state.data);
  if (prep.missing.length) {
    toast('有变量没有取值：' + prep.missing.join('、'), 'bad');
  }
  if (prep.multipart) {
    const noFile = prep.multipart.parts.filter((p) => p.type === 'file' && p.missing && !p.fileName);
    if (noFile.length) {
      toast('有 ' + noFile.length + ' 个文件字段还没选文件', 'bad');
    }
  }
  state.sending = true;
  state.response = null;
  state.respTab = 'body';
  if (!canHaveBody(req.method) && req.body.mode !== 'none') {
    toast(req.method + ' 请求不会带请求体 —— 只改请求体里的值不会生效，要改上面的查询参数', 'bad');
  }
  if (state.ui && state.ui.paintSend) state.ui.paintSend();
  renderResponse();
  const t0 = performance.now();
  const controller = new AbortController();
  state.abort = controller;
  try {
    const result = state.mode === 'host'
      ? await sendHost(prep, controller.signal)
      : await sendStandalone(prep, controller.signal);
    result.at = nowIso();
    result.requestUrl = prep.url;
    state.response = result;
  } catch (err) {
    if (err && err.name === 'AbortError') {
      state.response = { aborted: true, timeMs: Math.round(performance.now() - t0), requestUrl: prep.url };
    } else {
      state.response = { error: (err && err.message) || String(err), timeMs: err.timeMs || Math.round(performance.now() - t0), requestUrl: prep.url };
    }
  } finally {
    state.sending = false;
    state.abort = null;
    if (state.ui && state.ui.paintSend) state.ui.paintSend();
    renderResponse();
  }
}

function cancelSend() {
  if (state.abort) state.abort.abort();
}

/* ═══════════════════════════════════════════════════════════════════
   7. 渲染 · 侧栏
   ═══════════════════════════════════════════════════════════════════ */

function folderCounts() {
  const counts = new Map();
  for (const r of state.data.requests) {
    if (!r.folderId) continue;
    counts.set(r.folderId, (counts.get(r.folderId) || 0) + 1);
  }
  return counts;
}

function collectionCounts() {
  const counts = new Map();
  for (const r of state.data.requests) {
    counts.set(r.collectionId, (counts.get(r.collectionId) || 0) + 1);
  }
  return counts;
}

/** 当前操作落在哪个集合：选中的接口 → 上次点的 → 第一个 */
function currentCollectionId() {
  const req = currentRequest();
  if (req && req.collectionId) return req.collectionId;
  if (state.lastCollectionId && state.data.collections.some((c) => c.id === state.lastCollectionId)) {
    return state.lastCollectionId;
  }
  return state.data.collections[0] ? state.data.collections[0].id : '';
}

function collectionName(id) {
  const c = state.data.collections.find((x) => x.id === id);
  return c ? c.name : '';
}

function folderName(id) {
  const f = state.data.folders.find((x) => x.id === id);
  return f ? f.name : '';
}

function renderSidebar() {
  const list = $('#list');
  // 整棵树重画会把滚动位置带丢，记一下再还回去
  const keepScroll = list.scrollTop;
  clear(list);
  const q = state.query.trim();

  if (!state.data.collections.length) {
    list.appendChild(emptyState());
    updateCount();
    list.scrollTop = keepScroll;
    return;
  }

  // 搜索：拍平成一张表，旁边标出它属于哪个集合
  if (q) {
    const matching = visibleRequests();
    if (!matching.length) {
      list.appendChild(h('div', { class: 'empty' }, '没有匹配的接口'));
    } else {
      for (const r of matching) list.appendChild(requestRow(r, 0, collectionName(r.collectionId)));
    }
    updateCount(matching.length);
    list.scrollTop = keepScroll;
    return;
  }

  const fCounts = folderCounts();
  const cCounts = collectionCounts();
  const byParent = new Map();
  for (const f of state.data.folders) {
    const key = str(f.parentId);
    if (!byParent.has(key)) byParent.set(key, []);
    byParent.get(key).push(f);
  }

  const walk = (collectionId, parentId, depth) => {
    const kids = (byParent.get(str(parentId)) || []).filter((f) => f.collectionId === collectionId);
    for (const f of kids) {
      const open = state.openFolders[f.id] !== false;
      const folderRow = h('div', {
        class: 'folder',
        'data-open': open ? '1' : '0',
        style: { paddingLeft: (6 + depth * 12) + 'px' },
        title: '拖动接口到这里＝放进这个分组',
        onclick: () => {
          state.openFolders[f.id] = !open;
          persistOpenFolders();
          renderSidebar();
        }
      },
        h('span', { class: 'caret' }, '▼'),
        h('span', { class: 'fname', text: f.name }),
        h('span', { class: 'fcount' }, fCounts.get(f.id) || ''),
        h('span', { class: 'facts' },
          h('button', { class: 'fact', title: '重命名分组', onclick: (e) => { e.stopPropagation(); void renameFolder(f); } }, '✎'),
          h('button', { class: 'fact del', title: '删除分组', onclick: (e) => { e.stopPropagation(); void removeFolder(f); } }, '✕')
        )
      );
      bindFolderDrop(folderRow, f);
      list.appendChild(folderRow);
      if (open) walk(collectionId, f.id, depth + 1);
    }
    for (const r of state.data.requests) {
      if (r.collectionId === collectionId && str(r.folderId) === str(parentId)) {
        list.appendChild(requestRow(r, depth));
      }
    }
  };

  for (const c of state.data.collections) {
    const open = state.openCollections[c.id] !== false;
    const count = cCounts.get(c.id) || 0;
    const row = h('div', {
      class: 'collection',
      'data-open': open ? '1' : '0',
      draggable: 'true',
      title: (c.description || c.name) + '\n拖动可以调整集合顺序',
      onclick: () => {
        state.openCollections[c.id] = !open;
        state.lastCollectionId = c.id;
        persistOpenFolders();
        renderSidebar();
      }
    },
      h('span', { class: 'caret' }, '▼'),
      h('span', { class: 'cname', text: c.name }),
      h('span', { class: 'ccount' }, count || ''),
      h('span', { class: 'facts' },
        h('button', { class: 'fact', title: '在这个集合里新建接口', onclick: (e) => { e.stopPropagation(); addRequest(null, c.id); } }, '＋'),
        h('button', { class: 'fact', title: '新建分组', onclick: (e) => { e.stopPropagation(); void addFolder(c.id); } }, '▤'),
        h('button', { class: 'fact', title: '编辑集合', onclick: (e) => { e.stopPropagation(); void renameCollection(c); } }, '✎'),
        h('button', { class: 'fact del', title: '删除集合（连同里面的接口）', onclick: (e) => { e.stopPropagation(); void removeCollection(c); } }, '✕')
      )
    );
    bindCollectionDrag(row, c);
    list.appendChild(row);
    if (open) walk(c.id, null, 1);
  }
  updateCount();
  list.scrollTop = keepScroll;
}

/* ── 拖动：集合排序 / 接口排序与搬家 ── */

/** 正在拖的东西：{ type: 'collection' | 'request', id } */
let dragState = null;

function isDragging(type) {
  return dragState !== null && dragState.type === type;
}

function clearDropHints() {
  for (const el of document.querySelectorAll('.drop-before, .drop-after, .drop-into')) {
    el.classList.remove('drop-before', 'drop-after', 'drop-into');
  }
}

function reorderCollection(fromId, toId, place) {
  const list = state.data.collections;
  const from = list.findIndex((c) => c.id === fromId);
  if (from < 0 || !toId) return;
  const toTarget = list.findIndex((c) => c.id === toId);
  if (toTarget < 0) return;
  if (from === toTarget && place) return;
  const moved = list.splice(from, 1)[0];
  let to = list.findIndex((c) => c.id === toId);
  if (to < 0) to = list.length;
  if (place === 'after') to += 1;
  list.splice(to, 0, moved);
  markDirty();
