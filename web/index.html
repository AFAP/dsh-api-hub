  renderSidebar();
}

/**
 * 把接口挪到新位置：before/after 跟着目标接口，into 放到目标末尾。
 * 目标在别的集合/分组里时，会连 collectionId / folderId 一起改过去（等于搬家）。
 */
function moveRequestTo(dragId, target, place) {
  const list = state.data.requests;
  const from = list.findIndex((r) => r.id === dragId);
  if (from < 0) return;
  if (target.id && target.id === dragId) return;
  const moved = list[from];
  const oldCid = moved.collectionId;
  const oldFid = moved.folderId;
  list.splice(from, 1);
  moved.collectionId = target.collectionId;
  moved.folderId = target.folderId;
  if (place === 'into') {
    list.push(moved);
  } else {
    let at = list.findIndex((r) => r.id === target.id);
    if (at < 0) at = list.length;
    if (place === 'after') at += 1;
    list.splice(at, 0, moved);
  }
  // 目标那边可能收起来了，挪过去要能看见
  state.openCollections[moved.collectionId] = true;
  if (moved.folderId) state.openFolders[moved.folderId] = true;
  persistOpenFolders();
  markDirty();
  renderSidebar();
  const row = document.querySelector('#list .req[data-id="' + moved.id + '"]');
  if (row && row.scrollIntoView) row.scrollIntoView({ block: 'nearest' });
  // 换了集合/分组就说一声，免得以为只是挪了个位置
  if (moved.collectionId !== oldCid || str(moved.folderId) !== str(oldFid)) {
    const where = folderName(moved.folderId);
    toast('「' + moved.name + '」已移到 ' + collectionName(moved.collectionId) + (where ? ' / ' + where : ''));
  }
}

/** 通用的「拖到这里」高亮：返回指针落在上半还是下半 */
function dropPlace(row, e) {
  const box = row.getBoundingClientRect();
  return (e.clientY - box.top) > box.height / 2 ? 'after' : 'before';
}

function bindCollectionDrag(row, c) {
  row.addEventListener('dragstart', (e) => {
    // 从右侧小按钮上按下时不要开始拖
    if (e.target && e.target.closest && e.target.closest('.facts')) {
      e.preventDefault();
      return;
    }
    dragState = { type: 'collection', id: c.id };
    row.classList.add('dragging');
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', c.name); } catch (_) { /* 忽略 */ }
    }
  });

  row.addEventListener('dragend', () => {
    row.classList.remove('dragging');
    clearDropHints();
    dragState = null;
  });

  row.addEventListener('dragover', (e) => {
    if (!dragState) return;
    if (isDragging('collection') && dragState.id === c.id) return;
    e.preventDefault();
    e.stopPropagation();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    clearDropHints();
    if (isDragging('collection')) {
      row.classList.add(dropPlace(row, e) === 'after' ? 'drop-after' : 'drop-before');
    } else {
      row.classList.add('drop-into');
    }
  });

  row.addEventListener('dragleave', () => {
    row.classList.remove('drop-before', 'drop-after', 'drop-into');
  });

  row.addEventListener('drop', (e) => {
    if (!dragState) return;
    if (isDragging('collection') && dragState.id === c.id) return;
    e.preventDefault();
    e.stopPropagation();
    const state0 = dragState;
    dragState = null;
    clearDropHints();
    if (state0.type === 'collection') {
      reorderCollection(state0.id, c.id, dropPlace(row, e));
    } else {
      // 接口拖到集合头 = 放进这个集合的根目录（末尾）
      moveRequestTo(state0.id, { id: null, collectionId: c.id, folderId: null }, 'into');
    }
  });
}

/** 分组行：接受接口拖入（放到这个分组末尾） */
function bindFolderDrop(row, f) {
  row.addEventListener('dragover', (e) => {
    if (!isDragging('request')) return;
    e.preventDefault();
    e.stopPropagation();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    clearDropHints();
    row.classList.add('drop-into');
  });
  row.addEventListener('dragleave', () => row.classList.remove('drop-into'));
  row.addEventListener('drop', (e) => {
    if (!isDragging('request')) return;
    e.preventDefault();
    e.stopPropagation();
    const id = dragState.id;
    dragState = null;
    clearDropHints();
    moveRequestTo(id, { id: null, collectionId: f.collectionId, folderId: f.id }, 'into');
  });
}

/** 接口行：拖动排序 / 拖到别的集合或分组 */
function bindRequestDrag(row, r) {
  row.draggable = true;
  row.addEventListener('dragstart', (e) => {
    if (e.target && e.target.closest && e.target.closest('.facts')) {
      e.preventDefault();
      return;
    }
    dragState = { type: 'request', id: r.id };
    row.classList.add('dragging');
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', r.name); } catch (_) { /* 忽略 */ }
    }
  });

  row.addEventListener('dragend', () => {
    row.classList.remove('dragging');
    clearDropHints();
    dragState = null;
  });

  row.addEventListener('dragover', (e) => {
    if (!isDragging('request') || dragState.id === r.id) return;
    e.preventDefault();
    e.stopPropagation();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    clearDropHints();
    row.classList.add(dropPlace(row, e) === 'after' ? 'drop-after' : 'drop-before');
  });

  row.addEventListener('dragleave', () => {
    row.classList.remove('drop-before', 'drop-after');
  });

  row.addEventListener('drop', (e) => {
    if (!isDragging('request') || dragState.id === r.id) return;
    e.preventDefault();
    e.stopPropagation();
    const id = dragState.id;
    dragState = null;
    clearDropHints();
    moveRequestTo(id, { id: r.id, collectionId: r.collectionId, folderId: r.folderId }, dropPlace(row, e));
  });
}

function requestRow(r, depth, extra) {
  const row = h('button', {
    class: 'req',
    'data-id': r.id,
    'data-on': state.selectedId === r.id ? '1' : '0',
    style: { paddingLeft: (6 + depth * 12) + 'px' },
    title: (r.url || '(未填地址)') + '\n' + r.name + '\n（可拖动排序，或拖到别的集合/分组）',
    onclick: () => selectRequest(r.id)
  },
    h('span', { class: 'method', 'data-m': r.method }, r.method),
    h('span', { class: 'rname', text: r.name }),
    extra ? h('span', { class: 'rtag', text: extra }) : null,
    h('span', { class: 'facts' },
      h('button', { class: 'fact', title: '重命名', onclick: (e) => { e.stopPropagation(); void renameRequest(r); } }, '✎'),
      h('button', { class: 'fact', title: '复制一份', onclick: (e) => { e.stopPropagation(); duplicateRequest(r); } }, '⧉'),
      h('button', { class: 'fact del', title: '删除', onclick: (e) => { e.stopPropagation(); void removeRequest(r); } }, '✕')
    )
  );
  bindRequestDrag(row, r);
  return row;
}

/** 只改高亮，不重画列表 —— 免得点一下列表就跳回顶部 */
function paintSelection() {
  for (const row of document.querySelectorAll('#list .req')) {
    row.dataset.on = row.dataset.id === state.selectedId ? '1' : '0';
  }
}

function emptyState() {
  const host = state.mode === 'host';
  return h('div', { class: 'empty' },
    h('b', null, host ? '数据文件是空的' : '还没有打开数据文件'),
    host
      ? '导入 Postman 集合，或者新建一个接口。改动会自动写回 JSON 文件。'
      : h('span', null, '打开一个 JSON 存下来，或者直接导入 Postman 集合。'),
    h('div', { class: 'btns' },
      h('button', { class: 'btn primary', onclick: () => void importDialog() }, '导入 Postman Collection'),
      h('button', { class: 'btn', onclick: () => addRequest() }, '＋ 新建接口'),
      host
        ? h('button', {
          class: 'btn',
          onclick: () => void askDataPath(state.hostInfo ? state.hostInfo.dataFile : '')
        }, '换个数据文件位置')
        : h('button', { class: 'btn', onclick: () => void openLocalFile() }, '打开 JSON 文件')
    ),
    h('div', { style: 'margin-top:6px' }, '也可以把 .json 文件拖进窗口（可多选）')
  );
}

function updateCount(filtered) {
  const n = state.data.requests.length;
  const c = state.data.collections.length;
  $('#countLabel').textContent = filtered === undefined
    ? c + ' 个集合 · ' + n + ' 个接口'
    : '命中 ' + filtered + ' / ' + n;
}

/* ═══════════════════════════════════════════════════════════════════
   8. 渲染 · 编辑区
   ═══════════════════════════════════════════════════════════════════ */

function selectRequest(id) {
  if (state.selectedId !== id) state.response = null;
  state.selectedId = id;
  const req = state.data.requests.find((r) => r.id === id);
  if (req) state.lastCollectionId = req.collectionId;
  state.tab = state.tab || 'params';
  try { localStorage.setItem(LS_KEY.sel, id || ''); } catch (_) { /* 忽略 */ }
  paintSelection();
  renderEditor();
}

function renderEditor() {
  const pane = $('#pane');
  clear(pane);
  const req = currentRequest();
  if (!req) {
    pane.appendChild(h('div', { class: 'paneEmpty' },
      h('div', { class: 'big' }, '⌁'),
      h('div', null, '选一个接口，或者新建一个'),
      h('div', null, h('kbd', null, 'Ctrl'), ' + ', h('kbd', null, 'N'), ' 快速新建')
    ));
    return;
  }

  /* ── 请求头区域 ── */
  const nameInput = h('input', {
    class: 'nameInput',
    value: req.name,
    placeholder: '接口名字（方便以后找）',
    oninput: (e) => {
      req.name = e.target.value;
      markDirty();
      updateCount();
    },
    onchange: () => renderSidebar()
  });

  const methodSel = h('select', {
    class: 'methodSel',
    'data-m': req.method,
    onchange: (e) => {
      req.method = e.target.value;
      methodSel.dataset.m = req.method;
      markDirty();
      renderSidebar();
    }
  }, METHODS.map((m) => h('option', { value: m, selected: req.method === m }, m)));

  const urlInput = h('input', {
    class: 'urlInput',
    value: req.url,
    placeholder: '接口地址，支持 {{变量}}，例如 {{baseUrl}}/api/user',
    spellcheck: 'false',
    oninput: (e) => {
      req.url = e.target.value;
      markDirty();
      paintUrlHint();
    },
    onchange: () => {
      // 地址里带的 query 搬进参数表；没带就保留手填的参数，不覆盖
      const split = splitUrl(req.url);
      if (split.params.length) req.params = split.params;
      if (split.base !== req.url) {
        req.url = split.base;
        urlInput.value = req.url;
      }
      markDirty();
      renderTabBody();
      paintUrlHint();
      renderSidebar();
    },
    onkeydown: (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) void doSend(); }
  });

  const sendBtn = h('button', {
    class: 'sendBtn',
    title: '发送（Ctrl+Enter）'
  });
  sendBtn.addEventListener('click', () => (state.sending ? cancelSend() : void doSend()));
  function paintSend() {
    clear(sendBtn);
    if (state.sending) {
      sendBtn.appendChild(h('span', { class: 'spin' }));
      sendBtn.appendChild(document.createTextNode('取消'));
    } else {
      sendBtn.appendChild(document.createTextNode('发送'));
    }
  }
  paintSend();

  const urlHint = h('div', { class: 'urlHint' });
  function paintUrlHint() {
    clear(urlHint);
    const r = currentRequest();
    if (!r) return;
    urlHint.style.display = '';
    const prep = prepare(r, state.data);
    if (prep.missing.length) {
      urlHint.appendChild(h('span', null, '未解析变量：'));
      urlHint.appendChild(h('b', null, prep.missing.join('、')));
      return;
    }
    if (!prep.url) { urlHint.appendChild(h('span', { class: 'ok' }, '填上地址就能发')); return; }
    const dup = duplicateBodyKeys(r);
    // 地址框里已经能看全、也没有别的话要说时，这行就别占地方了
    if (prep.url === str(r.url).trim() && !dup.length) {
      urlHint.style.display = 'none';
      return;
    }
    urlHint.appendChild(h('span', {
      class: 'ok',
      text: prep.url,
      title: '这是实际会发出的完整地址，点一下复制',
      onclick: async () => {
        const ok = await copyText(prep.url);
        toast(ok ? '已复制完整地址' : '复制失败', ok ? 'ok' : 'bad');
      }
    }));
    if (dup.length) {
      urlHint.appendChild(h('span', { class: 'warnText' },
        '　·　请求体里也有 ' + dup.join('、') + (canHaveBody(r.method) ? '（两处都在发）' : '（' + r.method + ' 不发请求体，只有查询参数生效）')));
    }
  }

  const head = h('div', { class: 'reqHead' },
    h('div', { class: 'row1' }, nameInput),
    h('div', { class: 'urlRow' }, methodSel, urlInput, sendBtn),
    urlHint
  );

  /* ── 标签页 ── */
  const TABS = [
    { key: 'params', label: '参数', count: () => req.params.filter((p) => p.key).length },
    { key: 'headers', label: '请求头', count: () => req.headers.filter((p) => p.key).length },
    {
      key: 'body',
      label: '请求体',
      dot: () => req.body.mode !== 'none' && canHaveBody(req.method),
      warn: () => req.body.mode !== 'none' && !canHaveBody(req.method)
    },
    { key: 'auth', label: '认证', dot: () => req.auth.type !== 'none' },
    { key: 'note', label: '备注', dot: () => !!req.note }
  ];
  const tabsBar = h('div', { class: 'tabs' }, TABS.map((t) => h('button', {
    class: 'tab',
    'data-on': state.tab === t.key ? '1' : '0',
    onclick: () => { state.tab = t.key; renderEditor(); }
  },
    t.label,
    t.count ? h('span', { class: 'cnt', text: t.count() ? String(t.count()) : '' }) : null,
    t.dot && t.dot() ? h('span', { class: 'dot' }) : null,
    t.warn && t.warn() ? h('span', { class: 'dot warn', title: '这个请求不会发送请求体' }) : null
  )));

  const tabBody = h('div', { class: 'tabBody', id: 'tabBody' });

  function renderTabBody() {
    clear(tabBody);
    if (state.tab === 'params') tabBody.appendChild(paramsPanel(req, renderTabBody));
    else if (state.tab === 'headers') tabBody.appendChild(headersPanel(req, renderTabBody));
    else if (state.tab === 'body') tabBody.appendChild(bodyPanel(req, renderTabBody));
    else if (state.tab === 'auth') tabBody.appendChild(authPanel(req, renderTabBody));
    else tabBody.appendChild(notePanel(req));
  }
  renderTabBody();

  /* ── 响应区 ── */
  const resp = h('div', { class: 'resp' });

  pane.appendChild(head);
  pane.appendChild(tabsBar);
  pane.appendChild(tabBody);
  pane.appendChild(resp);

  state.ui = { resp: resp, sendBtn: sendBtn, paintSend: paintSend, paintUrlHint: paintUrlHint, renderTabBody: renderTabBody, tabsBar: tabsBar };
  paintUrlHint();
  renderResponse();
}

/* ── 参数表 ── */
function paramsPanel(req, refresh) {
  const wrap = h('div');
  wrap.appendChild(h('div', { class: 'kvHead' },
    h('span', null, '查询参数（拼在 URL 后面）'),
    h('span', { style: 'margin-left:auto' }, '勾选 = 参与请求')));
  const box = h('div');
  kvEditor(box, req.params, refresh, 'key', 'value');
  wrap.appendChild(box);
  return wrap;
}

function headersPanel(req, refresh) {
  const wrap = h('div');
  wrap.appendChild(h('div', { class: 'kvHead' },
    h('span', null, '请求头'),
    h('button', {
      class: 'link', style: 'margin-left:auto',
      onclick: () => {
        const has = req.headers.some((x) => x.key.toLowerCase() === 'content-type' && x.enabled !== false);
        if (has) { toast('已经有 Content-Type 了'); return; }
        req.headers.push({ key: 'Content-Type', value: 'application/json', enabled: true });
        markDirty();
        refresh();
      }
    }, '＋ Content-Type')));
  const box = h('div');
  kvEditor(box, req.headers, refresh, 'key', 'value');
  wrap.appendChild(box);
  return wrap;
}

/** 通用 key/value 编辑器：总是多留一行空白，输入即落库 */
function kvEditor(container, rows, refresh, _a, _b) {
  clear(container);
  const render = () => {
    clear(container);
    const all = rows.concat([{ key: '', value: '', enabled: true, __phantom: true }]);
    all.forEach((row, index) => {
      const isPhantom = row.__phantom === true;
      const enabled = h('input', {
        type: 'checkbox',
        checked: row.enabled !== false,
        onchange: (e) => {
          if (isPhantom) return;
          row.enabled = e.target.checked;
          node.dataset.off = row.enabled ? '0' : '1';
          markDirty();
        }
      });
      const keyInput = h('input', {
        type: 'text', class: 'k', value: row.key, placeholder: isPhantom ? 'key' : '',
        spellcheck: 'false',
        oninput: (e) => {
          if (isPhantom) {
            rows.push({ key: e.target.value, value: '', enabled: true });
            markDirty();
            render();
            focusAt(rows.length - 1, 'k');
            return;
          }
          row.key = e.target.value;
          markDirty();
        }
      });
      const valInput = h('input', {
        type: 'text', class: 'v', value: row.value, placeholder: isPhantom ? 'value' : '',
        spellcheck: 'false',
        oninput: (e) => {
          if (isPhantom) {
            rows.push({ key: '', value: e.target.value, enabled: true });
            markDirty();
            render();
            focusAt(rows.length - 1, 'v');
            return;
          }
          row.value = e.target.value;
          markDirty();
        }
      });
      const node = h('div', { class: 'kvRow', 'data-off': row.enabled === false ? '1' : '0' },
        isPhantom ? h('span', { style: 'width:13px;flex:none' }) : enabled,
        keyInput, valInput,
        isPhantom ? h('span', { style: 'width:16px;flex:none' }) : h('button', {
          class: 'del', title: '删除这一行',
          onclick: () => { rows.splice(index, 1); markDirty(); render(); }
        }, '✕')
      );
      container.appendChild(node);
    });
  };
  const focusAt = (rowIndex, which) => {
    const nodes = container.querySelectorAll('.kvRow');
    const node = nodes[rowIndex];
    if (!node) return;
    const input = node.querySelector('.' + which);
    if (input) { input.focus(); const v = input.value; input.setSelectionRange(v.length, v.length); }
  };
  render();
}

/* ── 请求体 ── */

/** GET / HEAD 一般不带请求体：浏览器直连发不出去，服务端也多半只读查询参数 */
function canHaveBody(method) {
  return method !== 'GET' && method !== 'HEAD';
}

/** 请求体里的字段名同时出现在查询参数里的那些 */
function duplicateBodyKeys(req) {
  if (req.body.mode !== 'urlencoded' && req.body.mode !== 'formdata') return [];
  const paramKeys = new Set(
    req.params.filter((p) => p.enabled !== false && p.key.trim()).map((p) => p.key.trim())
  );
  const seen = new Set();
  for (const row of req.body.form) {
    if (row.enabled === false || !row.key.trim()) continue;
    const key = row.key.trim();
    if (paramKeys.has(key)) seen.add(key);
  }
  return [...seen];
}

/** 把请求体里的字段一键同步到查询参数（同名覆盖，不同名追加） */
function syncBodyToParams(req) {
  if (req.body.mode !== 'urlencoded' && req.body.mode !== 'formdata') return 0;
  let n = 0;
  for (const row of req.body.form) {
    if (row.enabled === false || !row.key.trim()) continue;
    const key = row.key.trim();
    const hit = req.params.find((p) => p.key.trim() === key);
    if (hit) {
      hit.value = row.value;
      hit.enabled = true;
    } else {
      req.params.push({ key: key, value: row.value, enabled: true });
    }
    n++;
  }
  return n;
}

function bodyPanel(req, refresh) {
  const wrap = h('div');
  const modes = [
    { key: 'none', label: '无' },
    { key: 'raw', label: 'Raw' },
    { key: 'urlencoded', label: 'x-www-form-urlencoded' },
    { key: 'formdata', label: 'form-data' }
  ];
  const seg = h('div', { class: 'seg' }, modes.map((m) => h('button', {
    'data-on': req.body.mode === m.key ? '1' : '0',
    onclick: () => { req.body.mode = m.key; markDirty(); refresh(); }
  }, m.label)));
  wrap.appendChild(h('div', { class: 'bodyTools' }, seg));

  if (req.body.mode !== 'none' && !canHaveBody(req.method)) {
    const dup = duplicateBodyKeys(req);
    wrap.appendChild(h('div', { class: 'warnBox' },
      h('span', { class: 'grow' },
        req.method + ' 请求一般不带请求体：浏览器直连根本发不出去，服务端也多半只看查询参数。'
        + (dup.length ? '　（' + dup.join('、') + ' 在查询参数里也有一份）' : '')),
      (req.body.mode === 'urlencoded' || req.body.mode === 'formdata')
        ? h('button', {
          class: 'btn',
          onclick: () => {
            const n = syncBodyToParams(req);
            if (!n) { toast('请求体里没有可同步的字段', 'bad'); return; }
            markDirty();
            refresh();
            if (state.ui && state.ui.paintUrlHint) state.ui.paintUrlHint();
            toast('已把 ' + n + ' 个字段同步到查询参数', 'ok');
          }
        }, '把字段同步到查询参数')
        : null));
  }

  if (req.body.mode === 'none') {
    wrap.appendChild(h('div', { class: 'hint' }, '这个请求不带请求体。'));
    return wrap;
  }
  if (req.body.mode === 'raw') {
    const langs = ['json', 'xml', 'html', 'text'];
    const langSeg = h('div', { class: 'seg' }, langs.map((l) => h('button', {
      'data-on': (req.body.language || 'json') === l ? '1' : '0',
      onclick: () => { req.body.language = l; markDirty(); refresh(); }
    }, l.toUpperCase())));
    const ta = h('textarea', {
      class: 'codeArea', spellcheck: 'false', placeholder: '{"hello":"world"}',
      value: req.body.raw,
      oninput: (e) => { req.body.raw = e.target.value; markDirty(); paintValid(); }
    });
    const valid = h('span', { class: 'hint' });
    function paintValid() {
      if ((req.body.language || 'json') !== 'json') { valid.textContent = ''; return; }
      const t = req.body.raw.trim();
      if (!t) { valid.textContent = ''; return; }
      try { JSON.parse(t); valid.className = 'hint'; valid.textContent = '✓ JSON 合法'; }
      catch (err) { valid.className = 'hint warn'; valid.textContent = '✗ ' + err.message; }
    }
    wrap.appendChild(h('div', { class: 'bodyTools' },
      langSeg,
      h('button', {
        class: 'btn', onclick: () => {
          try { req.body.raw = JSON.stringify(JSON.parse(req.body.raw), null, 2); }
          catch (err) { toast('不是合法 JSON：' + err.message, 'bad'); return; }
          markDirty(); refresh();
        }
      }, '格式化'),
      h('button', {
        class: 'btn', onclick: () => {
          try { req.body.raw = JSON.stringify(JSON.parse(req.body.raw)); }
          catch (err) { toast('不是合法 JSON：' + err.message, 'bad'); return; }
          markDirty(); refresh();
        }
      }, '压缩'),
      valid));
    wrap.appendChild(ta);
    paintValid();
    return wrap;
  }
  // urlencoded 用通用的 key/value；form-data 要能选文件，单独一套
  if (req.body.mode === 'urlencoded') {
    wrap.appendChild(h('div', { class: 'kvHead' }, h('span', null, '表单字段')));
    const box = h('div');
    kvEditor(box, req.body.form, refresh);
    wrap.appendChild(box);
    return wrap;
  }
  // form-data 接着往同一个 wrap 里画（bodyTools / 警示条都还在）
  return formDataPanel(req, refresh, wrap);
}

/* ── form-data：文本 + 文件 ── */
function formDataPanel(req, refresh, into) {
  const wrap = into || h('div');
  const multi = state.mode === 'host' ? '文件由本机代理读盘发送' : '文件由浏览器自己读取上传';
  wrap.appendChild(h('div', { class: 'kvHead' },
    h('span', null, '表单字段'),
    h('span', { style: 'margin-left:auto' }, 'multipart/form-data · ' + multi)));

  const box = h('div');

  const fileInput = h('input', {
    type: 'file',
    style: 'display:none',
    onchange: () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      const row = req.body.form.find((x) => x.id === pendingRowId);
      if (row) {
        row.fileName = file.name;
        row.contentType = file.type || 'application/octet-stream';
        state.formFiles.set(row.id, file);
        markDirty();
        refresh();
        toast('已选择 ' + file.name + '（' + fmtBytes(file.size) + '）', 'ok');
      }
      fileInput.value = '';
    }
  });
  let pendingRowId = '';

  const render = () => {
    clear(box);
    for (const row of req.body.form) if (!row.id) row.id = uid('row');
    const all = req.body.form.concat([{ id: '__phantom', key: '', value: '', enabled: true, type: 'text', __phantom: true }]);
    for (const row of all) {
      const isPhantom = row.__phantom === true;
      const isFile = row.type === 'file';
      const node = h('div', {
        class: 'kvRow formRow',
        'data-off': row.enabled === false ? '1' : '0'
      },
        isPhantom ? h('span', { style: 'width:13px;flex:none' }) : h('input', {
          type: 'checkbox',
          checked: row.enabled !== false,
          onchange: (e) => {
            row.enabled = e.target.checked;
            node.dataset.off = row.enabled ? '0' : '1';
            markDirty();
          }
        }),
        h('input', {
          type: 'text', class: 'k', value: row.key, placeholder: isPhantom ? 'key' : '',
          spellcheck: 'false',
          oninput: (e) => {
            if (isPhantom) {
              req.body.form.push({ id: uid('row'), key: e.target.value, value: '', enabled: true, type: 'text' });
              markDirty();
              render();
              focusAt(req.body.form.length - 1, 'k');
              return;
            }
            row.key = e.target.value;
            markDirty();
          }
        }),
        h('button', {
          class: 'typeBtn' + (isFile ? ' on' : ''),
          title: isFile ? '改成文本字段' : '改成文件字段',
          disabled: isPhantom,
          onclick: () => {
            if (isPhantom) return;
            row.type = isFile ? 'text' : 'file';
            if (!isFile) { row.value = ''; } else { state.formFiles.delete(row.id); row.fileName = ''; }
            markDirty();
            render();
          }
        }, isFile ? '文件' : '文本'),
        isFile
          ? h('span', { class: 'filePick' },
            h('button', {
              class: 'btn',
              onclick: () => {
                if (isPhantom) return;
                pendingRowId = row.id;
                fileInput.click();
              }
            }, '选择文件…'),
            h('span', { class: 'hint fileLabel', title: row.fileName || '' },
              row.fileName
                ? row.fileName + (state.formFiles.has(row.id) ? '（' + fmtBytes(state.formFiles.get(row.id).size) + '）' : '（需重新选择）')
                : '未选择'))
          : h('input', {
            type: 'text', class: 'v', value: row.value, placeholder: isPhantom ? 'value' : '',
            spellcheck: 'false',
            oninput: (e) => {
              if (isPhantom) {
                req.body.form.push({ id: uid('row'), key: '', value: e.target.value, enabled: true, type: 'text' });
                markDirty();
                render();
                focusAt(req.body.form.length - 1, 'v');
                return;
              }
              row.value = e.target.value;
              markDirty();
            }
          }),
        isPhantom ? h('span', { style: 'width:16px;flex:none' }) : h('button', {
          class: 'del', title: '删除这一行',
          onclick: () => {
            if (row.type === 'file') state.formFiles.delete(row.id);
            req.body.form.splice(req.body.form.indexOf(row), 1);
            markDirty();
            render();
          }
        }, '✕')
      );
      box.appendChild(node);
    }
  };

  const focusAt = (rowIndex, which) => {
    const nodes = box.querySelectorAll('.formRow');
    const node = nodes[rowIndex];
    if (!node) return;
    const input = node.querySelector('.' + which);
    if (input) { input.focus(); const v = input.value; input.setSelectionRange(v.length, v.length); }
  };

  render();
  wrap.appendChild(box);
  wrap.appendChild(fileInput);
  return wrap;
}

/* ═══════════════════════════════════════════════════════════════════
   9. 渲染 · 响应
   ═══════════════════════════════════════════════════════════════════ */

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, (c) => (c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;'));
}

function highlightJson(text) {
  const re = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g;
  let out = '';
  let last = 0;
  let m;
  while ((m = re.exec(text))) {
    out += escapeHtml(text.slice(last, m.index));
    if (m[1]) {
      out += '<span class="j-' + (m[2] ? 'k' : 's') + '">' + escapeHtml(m[1]) + '</span>';
      if (m[2]) out += escapeHtml(m[2]);
    } else if (m[3]) {
      out += '<span class="j-l">' + m[3] + '</span>';
    } else {
      out += '<span class="j-n">' + m[4] + '</span>';
    }
    last = re.lastIndex;
  }
  out += escapeHtml(text.slice(last));
  return out;
}

/** 把一段 XML/HTML 按标签层级缩进，纯文本内容保持原样。 */
function prettyMarkup(text) {
  const src = String(text).replace(/\r\n/g, '\n').trim();
  if (!src) return src;
  const tokens = src.replace(/>\s*</g, '><').split(/(?=<)/);
  let depth = 0;
  const out = [];
  for (const token of tokens) {
    const t = token.trim();
    if (!t) continue;
    const closing = /^<\//.test(t);
    const selfClosing = /\/>$/.test(t) || /^<[!?]/.test(t);
    if (closing) depth = Math.max(0, depth - 1);
    out.push('  '.repeat(depth) + t);
    if (!closing && !selfClosing && /^<[a-zA-Z]/.test(t)) depth += 1;
  }
  return out.join('\n');
}

/** 去掉 BOM 和 XSSI 前缀，尽量把 JSON 认出来 */
function stripJsonNoise(text) {
  let s = String(text);
  if (s.charCodeAt(0) === 0xfeff) s = s.slice(1);
  s = s.replace(/^\s*\)\]\}'\s*/, '');
  return s;
}

function countJsonNodes(value, budget) {
  let n = 0;
  const walk = (v, depth) => {
    if (n > budget) return;
    n++;
    if (v && typeof v === 'object' && depth < 40) {
      for (const k of Object.keys(v)) {
        walk(v[k], depth + 1);
        if (n > budget) return;
      }
    }
  };
  walk(value, 0);
  return n;
}

const JT_MAX_NODES = 8000;
const JT_MAX_CHILDREN = 400;

function jsonPrimitive(v) {
  if (v === null) return h('span', { class: 'jt-null' }, 'null');
  if (typeof v === 'string') {
    const text = v.length > 240 ? v.slice(0, 240) + '…' : v;
    return h('span', { class: 'jt-str', title: v.length > 240 ? v : null }, JSON.stringify(text));
  }
  if (typeof v === 'number') return h('span', { class: 'jt-num' }, String(v));
  if (typeof v === 'boolean') return h('span', { class: 'jt-bool' }, String(v));
  return h('span', { class: 'jt-other' }, String(v));
}

function jsonTreeNode(key, value, depth, expandDepth) {
  const isArray = Array.isArray(value);
  const isContainer = value !== null && typeof value === 'object';

  // 根节点不占一行，直接把它的成员铺出来
  if (key === null && isContainer) {
    const wrap = h('div', { class: 'jt-node jt-root' });
    const entries = isArray ? value.map((v, i) => [String(i), v]) : Object.keys(value).map((k) => [k, value[k]]);
    for (const [k, v] of entries) wrap.appendChild(jsonTreeNode(k, v, 0, expandDepth));
    if (!entries.length) wrap.appendChild(h('div', { class: 'jt-emptyrow' }, isArray ? '[] 空数组' : '{} 空对象'));
    return wrap;
  }

  const wrap = h('div', { class: 'jt-node' });
  const row = h('div', {
    class: 'jt-row' + (isContainer ? ' jt-toggle' : ''),
    style: { paddingLeft: (6 + depth * 14) + 'px' }
  });
  const kids = h('div', { class: 'jt-kids' });
  let built = false;
  let open = false;

  const caret = h('span', { class: 'jt-caret' + (isContainer ? '' : ' jt-caret-empty') });
  row.appendChild(caret);

  if (key !== null) {
    row.appendChild(h('span', { class: 'jt-key' + (/^\d+$/.test(key) ? ' jt-key-idx' : '') }, key));
    row.appendChild(h('span', { class: 'jt-colon' }, isArray && /^\d+$/.test(key) ? ':' : ': '));
  }

  const summary = h('span', { class: 'jt-sum' });
  row.appendChild(summary);

  function build() {
    if (built) return;
    built = true;
    const entries = isArray
      ? value.map((v, i) => [String(i), v])
      : Object.keys(value).map((k) => [k, value[k]]);
    const limit = Math.min(entries.length, JT_MAX_CHILDREN);
    for (let i = 0; i < limit; i++) {
      kids.appendChild(jsonTreeNode(entries[i][0], entries[i][1], depth + 1, expandDepth));
    }
    if (entries.length > limit) {
      kids.appendChild(h('div', {
        class: 'jt-more',
        style: { paddingLeft: (6 + (depth + 1) * 14) + 'px' },
        onclick: (e) => {
          e.stopPropagation();
          moreRow.remove();
          for (let i = limit; i < entries.length && i < limit + JT_MAX_CHILDREN; i++) {
            kids.appendChild(jsonTreeNode(entries[i][0], entries[i][1], depth + 1, expandDepth));
          }
          if (entries.length > limit + JT_MAX_CHILDREN) {
            const next = h('div', {
              class: 'jt-more',
              style: { paddingLeft: (6 + (depth + 1) * 14) + 'px' },
              onclick: (ev) => { ev.stopPropagation(); moreRow.after(next); void 0; }
            }, '…还有 ' + (entries.length - limit - JT_MAX_CHILDREN) + ' 项（点开继续）');
            kids.appendChild(next);
          }
        }
      }, '…还有 ' + (entries.length - limit) + ' 项，点开显示'));
      const moreRow = kids.lastChild;
    }
  }

  function paint() {
    row.dataset.open = open ? '1' : '0';
    caret.textContent = isContainer ? (open ? '▾' : '▸') : '';
    clear(summary);
    if (!isContainer) {
      summary.appendChild(jsonPrimitive(value));
      return;
    }
    if (!open) {
      summary.appendChild(h('span', { class: 'jt-preview' },
        isArray ? '[' : '{',
        h('span', { class: 'jt-count' }, String(isArray ? value.length : Object.keys(value).length) + ' 项'),
        isArray ? ']' : '}'));
    }
    kids.hidden = !open;
  }

  function setOpen(next) {
    open = next;
    if (open) build();
    paint();
  }

  if (isContainer) {
    row.addEventListener('click', (e) => {
      e.stopPropagation();
      setOpen(!open);
    });
  }

  wrap.appendChild(row);
  wrap.appendChild(kids);
  wrap.__setOpen = setOpen;
  wrap.__isContainer = isContainer;
  if (isContainer && depth < expandDepth) setOpen(true);
  else paint();
  return wrap;
}

function jsonTreeView(value) {
  return jsonTreeNode(null, value, 0, 2);
}

/** 把整棵树按给定深度重铺一遍（展开全部 / 收起全部） */
function repaintTree(container, value, expandDepth) {
  clear(container);
  container.appendChild(jsonTreeNode(null, value, 0, expandDepth));
}

function prettyBody(resp) {
  const raw = str(resp.body);
  const text = stripJsonNoise(raw).trim() ? raw : raw;
  const ct = (resp.headers || []).filter(([k]) => k.toLowerCase() === 'content-type').map(([, v]) => v).join(';');
  const looksJson = /json/i.test(ct) || /^\s*[\[{]/.test(stripJsonNoise(text));
  if (looksJson && text.trim()) {
    try {
      const value = JSON.parse(stripJsonNoise(text));
      return { text: JSON.stringify(value, null, 2), kind: 'json', value: value };
    } catch (_) { /* 不是合法 JSON，按原样 */ }
  }
  const looksMarkup = /xml|html/i.test(ct) || /^\s*</.test(text);
  if (looksMarkup && text.trim()) return { text: prettyMarkup(raw), kind: 'markup' };
  return { text: text, kind: 'text' };
}

function renderResponse() {
  const box = state.ui && state.ui.resp;
  if (!box) return;
  clear(box);
  const resp = state.response;

  const bar = h('div', { class: 'respBar' });
  const bodyArea = h('div', { class: 'respBody' });

  if (state.sending) {
    bar.appendChild(h('span', { class: 'status', 'data-k': '3' }, '发送中…'));
    bar.appendChild(h('span', { class: 'meta' }, state.mode === 'host' ? '本机代理' : '浏览器直连'));
    box.appendChild(bar);
    box.appendChild(h('div', { class: 'respEmpty' }, h('span', { class: 'spin', style: 'border-color:var(--line2);border-top-color:var(--accent)' }), '等待响应…'));
    return;
  }
  if (!resp) {
    bar.appendChild(h('span', null, '响应'));
    box.appendChild(bar);
    box.appendChild(h('div', { class: 'respEmpty' }, '点「发送」看结果（Ctrl + Enter）'));
    return;
  }
  if (resp.aborted) {
    bar.appendChild(h('span', { class: 'status', 'data-k': '4' }, '已取消'));
    bar.appendChild(h('span', { class: 'meta' }, resp.timeMs + ' ms'));
    box.appendChild(bar);
    box.appendChild(h('div', { class: 'respEmpty' }, '请求被取消'));
    return;
  }
  if (resp.error) {
    bar.appendChild(h('span', { class: 'status', 'data-k': '0' }, '失败'));
    bar.appendChild(h('span', { class: 'meta' }, resp.timeMs + ' ms'));
    box.appendChild(bar);
    box.appendChild(h('div', { class: 'respErr', text: resp.error + '\n\n' + (resp.requestUrl || '') }));
    return;
  }

  const code = Number(resp.status) || 0;
  const kind = String(code).slice(0, 1) || '0';
  bar.appendChild(h('span', { class: 'status', 'data-k': kind }, code + ' ' + (resp.statusText || '')));
  bar.appendChild(h('span', { class: 'meta' }, resp.timeMs + ' ms'));
  bar.appendChild(h('span', { class: 'meta' }, fmtBytes(resp.size)));
  bar.appendChild(h('span', { class: 'via' }, resp.via || ''));

  const body = prettyBody(resp);
  const nodeCount = body.kind === 'json' ? countJsonNodes(body.value, JT_MAX_NODES + 1) : 0;
  const treeable = body.kind === 'json' && nodeCount <= JT_MAX_NODES;
  const lineCount = body.text ? body.text.split('\n').length : 0;
  bar.appendChild(h('span', { class: 'meta' }, lineCount + ' 行'));
  const seg = h('div', { class: 'seg' },
    h('button', {
      'data-on': state.respTab === 'body' ? '1' : '0',
      onclick: () => { state.respTab = 'body'; renderResponse(); }
    }, '正文'),
    h('button', {
      'data-on': state.respTab === 'headers' ? '1' : '0',
      onclick: () => { state.respTab = 'headers'; renderResponse(); }
    }, '响应头 ', h('span', { class: 'cnt' }, String((resp.headers || []).length)))
  );
  bar.appendChild(seg);

  if (state.respTab === 'body' && (treeable || body.kind === 'json')) {
    bar.appendChild(h('div', { class: 'seg' },
      treeable ? h('button', {
        'data-on': state.respView === 'tree' ? '1' : '0',
        onclick: () => { state.respView = 'tree'; try { localStorage.setItem('apihub.respView', 'tree'); } catch (_) { /* 忽略 */ } renderResponse(); }
      }, '树') : null,
      h('button', {
        'data-on': state.respView === 'raw' || !treeable ? '1' : '0',
        onclick: () => { state.respView = 'raw'; try { localStorage.setItem('apihub.respView', 'raw'); } catch (_) { /* 忽略 */ } renderResponse(); }
      }, '文本')));
  }

  bar.appendChild(h('button', {
    class: 'btn', style: 'height:24px;padding:0 8px',
    onclick: async () => {
      const ok = await copyText(state.respTab === 'headers'
        ? (resp.headers || []).map(([k, v]) => k + ': ' + v).join('\n')
        : body.text);
      toast(ok ? '已复制' : '复制失败', ok ? 'ok' : 'bad');
    }
  }, '复制'));
  bar.appendChild(h('button', {
    class: 'btn', style: 'height:24px;padding:0 8px',
    title: '把请求编辑区收起来，只看响应',
    onclick: () => {
      state.respFocus = !state.respFocus;
      const pane = document.querySelector('.pane');
      if (pane) pane.classList.toggle('respFocus', state.respFocus);
      try { localStorage.setItem('apihub.respFocus', state.respFocus ? '1' : '0'); } catch (_) { /* 忽略 */ }
      renderResponse();
    }
  }, state.respFocus ? '⤡ 还原' : '⤢ 放大'));
  bar.appendChild(h('button', {
    class: 'btn', style: 'height:24px;padding:0 8px',
    onclick: () => downloadText('response-' + code + '.txt', state.respTab === 'headers'
      ? (resp.headers || []).map(([k, v]) => k + ': ' + v).join('\n')
      : body.text)
  }, '下载'));

  box.appendChild(bar);

  if (state.respTab === 'headers') {
    const table = h('table', { class: 'hdrTable' }, (resp.headers || []).map(([k, v]) => h('tr', null,
      h('td', { text: k }), h('td', { text: v }))));
    bodyArea.appendChild(table);
  } else if (!body.text) {
    bodyArea.appendChild(h('div', { class: 'respEmpty' }, '空响应体'));
  } else if (treeable && state.respView === 'tree') {
    const treeHost = h('div', { class: 'jt' });
    treeHost.appendChild(jsonTreeNode(null, body.value, 0, 2));
    const tools = h('div', { class: 'treeTools' },
      h('button', { class: 'link', onclick: () => repaintTree(treeHost, body.value, 40) }, '展开全部'),
      h('button', { class: 'link', onclick: () => repaintTree(treeHost, body.value, 1) }, '收起'),
      h('span', { class: 'grow' }),
      h('span', { class: 'hint', style: 'margin:0' }, nodeCount + ' 个节点'));
    bodyArea.appendChild(tools);
    bodyArea.appendChild(treeHost);
  } else {
    const shown = body.text.length > 400000 ? body.text.slice(0, 400000) + '\n\n…（内容过长，已截断显示）' : body.text;
    bodyArea.appendChild(h('pre', {
      class: 'plain',
      html: body.kind === 'json' ? highlightJson(shown) : escapeHtml(shown)
    }));
  }
  box.appendChild(bodyArea);
}

function persistOpenFolders() {

function ensureCollection() {
  if (!state.data.collections.length) {
    const c = emptyCollection({ name: '我的接口' });
    state.data.collections.push(c);
    state.lastCollectionId = c.id;
    return c.id;
  }
  return currentCollectionId();
}

  const folder = folderId ? state.data.folders.find((f) => f.id === folderId) : null;
  const req = emptyRequest({
    name: '新建接口',
    collectionId: folder ? folder.collectionId : cid,
    folderId: folderId || null,
    url: (function () {
      const vars = varMap(state.data, folder ? folder.collectionId : cid);
      return vars.baseUrl ? vars.baseUrl + '/' : '';
    })()

  state.data.requests.push(req);
  state.selectedId = req.id;

}

async function addFolder(collectionId) {
  const cid = collectionId || ensureCollection();
  const name = await askText('新建分组', '新分组', '分组名字');
  if (name === null) return;
  state.data.folders.push({ id: uid('f'), collectionId: cid, name: name.trim() || '新分组', parentId: null });
  markDirty();
  renderSidebar();
}

async function renameFolder(f) {
  const name = await askText('重命名分组', f.name, '分组名字');
  if (name === null) return;
  f.name = name.trim() || f.name;
  markDirty();
  renderSidebar();
}

function collectFolderIds(rootId) {
  const ids = new Set([rootId]);
  let grew = true;
  while (grew) {
    grew = false;
    for (const x of state.data.folders) {
      if (ids.has(x.id)) continue;
      if (x.parentId && ids.has(x.parentId)) { ids.add(x.id); grew = true; }
    }
  }
  return ids;
}

async function removeFolder(f) {
  const ids = collectFolderIds(f.id);
  const inside = state.data.requests.filter((r) => r.folderId && ids.has(r.folderId));
  const ok = await askConfirm('删除分组',
    '删除「' + f.name + '」？里面的 ' + inside.length + ' 个接口会移到' + (f.parentId ? '上一级' : '集合根目录') + '。', '删除');
  if (!ok) return;
  for (const r of inside) r.folderId = f.parentId || null;
  state.data.folders = state.data.folders.filter((x) => !ids.has(x.id));
  markDirty();
  renderSidebar();
  renderEditor();
}

/** 上移/下移一格（拖动的键盘/触屏替代） */
function moveCollectionStep(c, delta) {
  const list = state.data.collections;
  const at = list.indexOf(c);
  const to = at + delta;
  if (at < 0 || to < 0 || to >= list.length) return;
  list.splice(at, 1);
  list.splice(to, 0, c);
  markDirty();
}

function safeFileName(name) {
  return String(name || 'api-hub').replace(/[\\/:*?"<>|]/g, '_').slice(0, 80);
}

async function removeCollection(c) {
  const ids = new Set(state.data.folders.filter((f) => f.collectionId === c.id).map((f) => f.id));
  const inside = state.data.requests.filter((r) => r.collectionId === c.id);
  const ok = await askConfirm('删除集合',
    '删除集合「' + c.name + '」？里面的 ' + inside.length + ' 个接口、' + ids.size + ' 个分组会一起删掉，不能撤销。', '删除');
  if (!ok) return;
  state.data.folders = state.data.folders.filter((f) => f.collectionId !== c.id);
  state.data.requests = state.data.requests.filter((r) => r.collectionId !== c.id);
  state.data.collections = state.data.collections.filter((x) => x.id !== c.id);
  if (state.selectedId && !state.data.requests.some((r) => r.id === state.selectedId)) state.selectedId = null;
  if (state.lastCollectionId === c.id) state.lastCollectionId = '';
  markDirty();
  renderSidebar();
  renderEditor();
}

/**
 * 导进当前数据文件。一次一个 JSON；多文件由调用方逐个喂进来。
 * @param {object} json
 * @param {{sameName?: 'new'|'merge'|'ask'}} [opts]
 */
async function doImport(json, opts) {
  const kind = detectFormat(json);
  if (kind === 'postman-env') {
    const values = json.values || (json.environment && json.environment.values) || [];
    let n = 0;
    for (const v of values) {
      if (!v || !v.key) continue;
      const found = state.data.variables.find((x) => x.key === v.key);
      if (found) found.value = str(v.value);
      else state.data.variables.push({ key: str(v.key), value: str(v.value), enabled: v.enabled !== false });
      n++;
    }
    markDirty();
    renderEditor();
    toast('已导入环境变量 ' + n + ' 个', 'ok');
    return n;
  }
  if (kind === 'unknown') { toast('认不出这个 JSON 的格式', 'bad'); return 0; }

  // API-HUB 自己的数据文件：整套并进来
  if (kind === 'apihub') {
    const n = importHubData(state.data, json);
    state.loaded = true;
    markDirty();
    renderSidebar();
    renderEditor();
    toast('已合并 ' + n.collections + ' 个集合、' + n.added + ' 个接口', 'ok');
    return n.added;
  }

  const parsed = kind === 'postman1' ? parsePostmanV1(json) : parsePostmanCollection(json);
  parsed.description = parsed.description || '';
  state.loaded = true;

  // 已经有同名集合：问一下是新建还是合并
  const same = state.data.collections.filter((c) => c.name === parsed.name);
  let mode = opts && opts.sameName ? opts.sameName : (same.length ? 'ask' : 'new');
  if (mode === 'ask' && same.length) {
    const choice = await modal({
      title: '已存在同名集合',
      body: h('p', null,
        '已经有一个叫「', h('b', null, parsed.name), '」的集合了（' +
        state.data.requests.filter((r) => r.collectionId === same[0].id).length + ' 个接口）。要怎么处理？'),
      actions: [
        { label: '取消', value: null },
        { label: '合并进去', value: 'merge' },
        { label: '新建一个', primary: true, value: 'new' }
      ]
    });
    if (!choice) return 0;
    mode = choice;
  }

  if (mode === 'merge') {
    const n = mergeIntoCollection(state.data, same[0].id, parsed);
    markDirty();
    renderSidebar();
    renderEditor();
    toast(n.added
      ? '已合并「' + parsed.name + '」：新增 ' + n.added + ' 个' + (n.skipped ? '，跳过重复 ' + n.skipped + ' 个' : '')
      : '「' + parsed.name + '」没有新接口（跳过重复 ' + n.skipped + ' 个）', n.added ? 'ok' : undefined);
    return n.added;
  }

  const collection = buildCollection(state.data, parsed);
  state.openCollections[collection.id] = true;
  state.lastCollectionId = collection.id;
  markDirty();
  renderSidebar();
  renderEditor();
  const count = state.data.requests.filter((r) => r.collectionId === collection.id).length;
  toast('已导入「' + collection.name + '」：' + count + ' 个接口', 'ok');
  return count;
}

async function importDialog() {
  const body = h('div');
  const status = h('div', { class: 'hint' });
  const picked = [];
  const area = h('textarea', {
    class: 'codeArea', style: 'min-height:180px',
    placeholder: '把 Postman Collection v2.1 导出的 JSON 粘进来，或者点下面的「选择文件」（可多选，一次导入多个集合）'
  });
  body.appendChild(h('p', null,
    '支持 Postman ', h('b', null, 'Collection v2.1 / v2.0 / v1'), '，以及 Postman 环境变量导出、API-HUB 自己的 JSON。一次可以选多个文件，每个集合会变成左侧的一个「集合」。'));
  body.appendChild(area);
  body.appendChild(h('div', { style: 'display:flex;gap:8px;align-items:center;margin-top:8px' },
    h('button', {
      class: 'btn', onclick: async () => {
        const files = await pickTextFiles();
        if (!files.length) return;
        picked.length = 0;
        picked.push(...files);
        area.value = '';
        status.textContent = '已选 ' + files.length + ' 个文件：' + files.map((f) => f.name).join('、');
      }
    }, '选择文件…'),
    status));

  const ok = await modal({
    title: '导入接口',
    body: body,
    actions: [
      { label: '取消', value: false },
      { label: '导入', primary: true, value: true }
    ]
  });
  if (!ok) return;

  // 多文件优先：一次把多个 collection 并进同一个数据文件
  if (picked.length) {
    let added = 0;
    const failed = [];
    for (const file of picked) {
      try {
        const json = JSON.parse(file.text);
        added += Number(await doImport(json, { sameName: 'new' })) || 0;
      } catch (err) {
        failed.push(file.name + '（' + err.message + '）');
      }
    }
    if (failed.length) toast('有 ' + failed.length + ' 个文件没导入：' + failed.slice(0, 3).join('；'), 'bad');
    else toast('已导入 ' + picked.length + ' 个集合，新增 ' + added + ' 个接口', 'ok');
    return;
  }

  const text = area.value.trim();
  if (!text) { toast('没内容可导入', 'bad'); return; }
  let json;
  try { json = JSON.parse(text); }
  catch (err) { toast('JSON 解析失败：' + err.message, 'bad'); return; }
  await doImport(json);
}

function pickTextFiles() {
  return new Promise((resolve) => {
    const input = $('#fileInput');
    input.value = '';
    input.onchange = async () => {
      const files = Array.from(input.files || []);
      if (!files.length) return resolve([]);
      const out = [];
      for (const file of files) out.push({ name: file.name, text: await file.text() });
      resolve(out);
    };
    input.click();
  });
}

function pickTextFile() {
  return new Promise((resolve) => {
    const input = $('#fileInput');
    input.value = '';
    input.onchange = async () => {
      const file = input.files && input.files[0];
      if (!file) return resolve(null);
      resolve(await file.text());
    };
    input.click();
  });
}

async function exportDialog() {
  const body = h('div');
  body.appendChild(h('p', null, '把接口导出成本地文件：备份、发给别人，或者再导回 Postman。'));

  const scopeSel = h('select', { class: 'textInput', style: 'height:32px' });
  scopeSel.appendChild(h('option', { value: '' }, '全部集合（' + state.data.collections.length + ' 个）'));
  for (const c of state.data.collections) {
    scopeSel.appendChild(h('option', { value: c.id }, '只导出：' + c.name));
  }

  const nameInput = h('input', { class: 'textInput', value: state.data.name || 'api-hub' });

  body.appendChild(h('div', { class: 'field' }, h('label', null, '范围'), scopeSel));
  body.appendChild(h('div', { class: 'field' }, h('label', null, '文件名（不带扩展名）'), nameInput));
  body.appendChild(h('ul', { class: 'hint' },
    h('li', null, 'Postman Collection v2.1：Postman 里 Import 就能打开；只导一个集合时是标准的单集合文件'),
    h('li', null, 'API-HUB JSON：就是存盘格式，可以直接当数据文件用')));

  const choice = await modal({
    title: '导出',
    body: body,
    actions: [
      { label: '取消', value: null },
      { label: 'API-HUB JSON', value: 'hub' },
      { label: 'Postman v2.1', primary: true, value: 'postman' }
    ]
  });
  if (!choice) return;

  const cid = scopeSel.value;
  const scopeName = cid ? collectionName(cid) : (state.data.name || 'api-hub');
  const base = safeFileName(nameInput.value && !cid ? nameInput.value : scopeName);
  if (choice === 'postman') {
    downloadText(base + '.postman_collection.json', JSON.stringify(toPostman(state.data, cid || undefined), null, 2));
  } else if (cid) {
    const one = emptyHub();
    one.name = scopeName;
    one.collections = state.data.collections.filter((c) => c.id === cid);
    one.folders = state.data.folders.filter((f) => f.collectionId === cid);
    one.requests = state.data.requests.filter((r) => r.collectionId === cid);
    one.variables = state.data.variables.slice();
    downloadText(base + '.json', JSON.stringify(one, null, 2));
  } else {
    downloadText(base + '.json', JSON.stringify(state.data, null, 2));
  }
  toast('已导出', 'ok');
}

async function varsDialog() {
  const body = h('div');
  body.appendChild(h('p', null,

let activeModalClose = null;

/** 从外面关掉当前模态（比如在弹窗里点了「去别处」） */
function closeModal() {
  const finish = activeModalClose;
  activeModalClose = null;
  if (finish) finish(null);
}

function modal(opts) {
  return new Promise((resolve) => {
    const host = $('#modalHost');
    host.hidden = false;
    clear(host);
    let done = false;
    const finish = (value) => {
      if (done) return;
      done = true;
      if (activeModalClose === finish) activeModalClose = null;
      host.hidden = true;
      clear(host);
      document.removeEventListener('keydown', onKey, true);
      resolve(value);
    };
    activeModalClose = finish;
    const onKey = (e) => {
      if (e.key === 'Escape') { e.stopPropagation(); finish(opts.escapeValue === undefined ? null : opts.escapeValue); }
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && opts.actions) {
        const primary = opts.actions.filter((a) => a.primary)[0];
        if (primary) { e.preventDefault(); finish(primary.value); }
      }
    };
    document.addEventListener('keydown', onKey, true);
    const box = h('div', { class: 'modal' + (opts.wide ? ' wide' : '') },
      h('div', { class: 'modalHead' },
        h('b', null, opts.title || ''),
        h('button', { class: 'x', onclick: () => finish(null) }, '✕')),
      h('div', { class: 'modalBody' }, opts.body),
      h('div', { class: 'modalFoot' }, (opts.actions || [{ label: '好', primary: true, value: true }]).map((a) => h('button', {
        class: 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : ''),
        onclick: () => finish(a.value)
      }, a.label)))
    );
    host.appendChild(box);
    host.onclick = (e) => { if (e.target === host) finish(null); };
    const focusable = box.querySelector('input,textarea,select,button.primary');
    if (focusable) setTimeout(() => focusable.focus(), 30);
  });
}

/** 单行文本输入框，返回输入值或 null（取消） */
function askText(title, value, placeholder) {
  return new Promise((resolve) => {
    const host = $('#modalHost');
    host.hidden = false;
    clear(host);
    let done = false;
    const input = h('input', { class: 'textInput', value: value || '', placeholder: placeholder || '' });
    const close = (v) => {
      if (done) return;
      done = true;
      host.hidden = true;
      clear(host);
      document.removeEventListener('keydown', onKey, true);
      resolve(v);
    };
    const onKey = (e) => {
      if (e.key === 'Escape') close(null);
      if (e.key === 'Enter' && e.target === input) close(input.value);
    };
    document.addEventListener('keydown', onKey, true);
    host.appendChild(h('div', { class: 'modal' },
      h('div', { class: 'modalHead' }, h('b', null, title), h('button', { class: 'x', onclick: () => close(null) }, '✕')),
      h('div', { class: 'modalBody' }, input),
      h('div', { class: 'modalFoot' },
        h('button', { class: 'btn', onclick: () => close(null) }, '取消'),
        h('button', { class: 'btn primary', onclick: () => close(input.value) }, '确定'))));
    host.onclick = (e) => { if (e.target === host) close(null); };
    setTimeout(() => { input.focus(); input.select(); }, 30);
  });
}

function askConfirm(title, message, okLabel) {
  return modal({
    title: title,
    body: h('p', { text: message }),
    actions: [
      { label: '取消', value: false },
      { label: okLabel || '确定', primary: true, danger: true, value: true }
    ]
  }).then((v) => v === true);
}

function recentPaths() {
  try {
    const list = JSON.parse(localStorage.getItem('apihub.recent') || '[]');
    return Array.isArray(list) ? list.filter((x) => typeof x === 'string') : [];
  } catch (_) {
    return [];
  }
}

function pushRecentPath(path) {
  if (!path) return;
  try {
    const list = recentPaths().filter((p) => p !== path);
    list.unshift(path);
    localStorage.setItem('apihub.recent', JSON.stringify(list.slice(0, 6)));
  } catch (_) { /* 忽略 */ }
}

/** 把当前数据写到另一个位置，然后继续用那个文件 */
async function saveAsHost() {
  const input = await askText('另存到新位置', state.dataPath || '', '绝对路径，或直接给个目录');
  if (input === null) return;
  const path = normalizeDataPath(input);
  if (!path) return;
  if (path === state.dataPath) { toast('还是同一个文件'); return; }
  try {
    const probe = await hostFetch('/open', { path: path }, 'POST');
    if (probe.exists) {
      const count = probe.data && Array.isArray(probe.data.requests) ? probe.data.requests.length : 0;
      const ok = await askConfirm('覆盖已有文件',
        '那里已经有 ' + shortPath(path) + '（' + (probe.data ? count + ' 个接口' : '内容无法解析') + '）。\n' +
        '确定用当前数据覆盖它？（原来的内容会没）', '覆盖');
      if (!ok) return;
    }
  } catch (_) { /* 探测失败就当不存在，后面写的时候再报错 */ }
  state.dataPath = path;
  state.readOnlyBlock = false;
  state.loaded = true;
  pushRecentPath(path);
  try { localStorage.setItem(LS_KEY.path, path); } catch (_) { /* 忽略 */ }
  paintDirty();
  await saveNow(false);
}

async function askDataPath(fallback) {

  return storageDialog().then(() => state.dataPath);

function folderPathOf(folderId) {
  const names = [];
  const byId = new Map(state.data.folders.map((f) => [f.id, f]));
  let cur = folderId;
  let guard = 0;
  while (cur && guard++ < 64) {
    const folder = byId.get(cur);
    if (!folder) break;
    names.unshift(folder.name);
    cur = folder.parentId;
  }
  return names.join(' / ');
}

function visibleRequests() {
  const q = state.query.trim().toLowerCase();
  if (!q) return state.data.requests;
  return state.data.requests.filter((r) =>
    r.name.toLowerCase().indexOf(q) >= 0 ||
    str(r.url).toLowerCase().indexOf(q) >= 0 ||
    r.method.toLowerCase().indexOf(q) >= 0 ||
    collectionName(r.collectionId).toLowerCase().indexOf(q) >= 0 ||
    folderPathOf(r.folderId).toLowerCase().indexOf(q) >= 0);
}

function moveSelection(delta) {
  const rows = visibleRequests();
  if (!rows.length) return;
  let at = rows.findIndex((r) => r.id === state.selectedId);
  if (at < 0) at = 0;
  const next = clamp(at + delta, 0, rows.length - 1);
  selectRequest(rows[next].id);
  const list = $('#list');
  const buttons = list ? list.querySelectorAll('.req') : [];
  const target = buttons[next];
  if (target && target.scrollIntoView) target.scrollIntoView({ block: 'nearest' });
}

function bindKeys() {
  document.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName) || '';
    const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable);
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 'enter') { e.preventDefault(); void doSend(); return; }
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); void saveNow(false); return; }
    if (mod && e.key.toLowerCase() === 'n') { e.preventDefault(); addRequest(); return; }
    if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
    if (mod && e.key === ',') { e.preventDefault(); void helpDialog(); return; }
    if (typing) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); moveSelection(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSelection(-1); }
    else if (e.key === 'Enter' && state.selectedId) { e.preventDefault(); void doSend(); }
    else if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  });
}

/**
 * 面板被切走或标签页要关时，把还没落盘的改动挤出去。
 * 插件模式下用 sendBeacon —— 页面随时会死，await 一个 fetch 不一定来得及。
 */
function flushOnExit() {
  if (!state.dirty || state.saving) return;
  if (state.mode !== 'host' || !state.dataPath) return;
  if (state.readOnlyBlock) return;
  try {
    const payload = JSON.stringify({ path: state.dataPath, data: state.data });
    const sent = navigator.sendBeacon(HOST_BASE + '/save', new Blob([payload], { type: 'application/json' }));
    if (sent) {
      state.dirty = false;
      paintDirty();
    }
  } catch (_) {
    /* 尽力而为 */
  }
}

function bindChrome() {
  $('#btnOpen').addEventListener('click', () => {
    if (state.mode === 'host') void storageDialog();
    else void openLocalFile();
  });
  // 顶部那条路径也能点：换存储位置 / 另存为
  $('#pathLabel').addEventListener('click', () => void storageDialog());
  $('#btnSave').addEventListener('click', () => void saveNow(false));
  $('#btnImport').addEventListener('click', () => void importDialog());
  $('#btnExport').addEventListener('click', () => void exportDialog());
  $('#btnVars').addEventListener('click', () => void varsDialog());
  $('#btnTheme').addEventListener('click', () => cycleTheme());
  $('#btnHelp').addEventListener('click', () => void helpDialog());
  $('#btnNewReq').addEventListener('click', () => addRequest());
  $('#btnNewFolder').addEventListener('click', () => void addFolder());
  $('#btnNewCollection').addEventListener('click', () => {
    const c = newCollection();
    void renameCollection(c);
  });
  $('#btnCollapse').addEventListener('click', () => {
    const anyOpen = Object.keys(state.openCollections).some((k) => state.openCollections[k] !== false);
    state.openCollections = {};
    state.openFolders = {};
    if (anyOpen) {
      for (const c of state.data.collections) state.openCollections[c.id] = false;
      for (const f of state.data.folders) state.openFolders[f.id] = false;
    }
    persistOpenFolders();
    renderSidebar();
  });
  $('#q').addEventListener('input', (e) => { state.query = e.target.value; renderSidebar(); });

  // 拖到列表空白处：集合 → 放到最后；接口 → 放到本列表最后一个接口后面
  const listEl = $('#list');
  const overRow = (e) => (e.target && e.target.closest ? e.target.closest('.req, .folder, .collection') : null);
  listEl.addEventListener('dragover', (e) => {
    if (!dragState) return;
    if (overRow(e)) { listEl.classList.remove('drop-end'); return; }
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    listEl.classList.add('drop-end');
  });
  listEl.addEventListener('dragleave', (e) => {
    if (e.target === listEl) listEl.classList.remove('drop-end');
  });
  listEl.addEventListener('drop', (e) => {
    listEl.classList.remove('drop-end');
    if (!dragState || overRow(e)) return;
    e.preventDefault();
    const dragged = dragState;
    dragState = null;
    clearDropHints();
    if (dragged.type === 'collection') {
      const last = state.data.collections[state.data.collections.length - 1];
      if (last) reorderCollection(dragged.id, last.id, 'after');
      return;
    }
    // 接口：放到当前最后一行之后（同一个父级）
    const rows = [...listEl.querySelectorAll('.req')];
    const tail = rows[rows.length - 1];
    if (!tail) return;
    const target = state.data.requests.find((r) => r.id === tail.dataset.id);
    if (target) moveRequestTo(dragged.id, { id: target.id, collectionId: target.collectionId, folderId: target.folderId }, 'after');
  });

  // 拖文件进窗口
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => {
    if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') < 0) return;
    dragDepth++;
    document.body.style.outline = '2px dashed var(--accent)';
    document.body.style.outlineOffset = '-6px';
  });
  window.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) { document.body.style.outline = ''; }
  });
  window.addEventListener('dragover', (e) => { e.preventDefault(); });
  window.addEventListener('drop', async (e) => {
    e.preventDefault();
    dragDepth = 0;
    document.body.style.outline = '';
    const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
    if (!files.length) {
      const text = e.dataTransfer && e.dataTransfer.getData('text/plain');
      if (text && text.trim()) {
        try { await doImport(JSON.parse(text)); }
        catch (err) { toast('粘贴的内容不是合法 JSON：' + err.message, 'bad'); }
      }
      return;
    }
    // 多选多个 collection：逐个建成新集合
    if (files.length === 1) {
      adoptFile(null, files[0].name, await files[0].text());
      return;
    }
    let added = 0;
    const failed = [];
    for (const file of files) {
      try {
        added += Number(await doImport(JSON.parse(await file.text()), { sameName: 'new' })) || 0;
      } catch (err) {
        failed.push(file.name);
      }
    }
    if (failed.length) toast('有 ' + failed.length + ' 个文件没导入：' + failed.slice(0, 3).join('、'), 'bad');
    else toast('已导入 ' + files.length + ' 个集合，新增 ' + added + ' 个接口', 'ok');
  });

  // 面板被切走 / 关标签页时，把没落盘的改动挤出去
  window.addEventListener('pagehide', flushOnExit);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushOnExit();
  });

  // 关页前提醒（插件模式下用 sendBeacon 兜底，不弹窗，免得挡住切换）
  window.addEventListener('beforeunload', (e) => {
    if (state.mode === 'file' && state.dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  // 宿主主题
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'apihub:theme' && (d.theme === 'light' || d.theme === 'dark')) {
      applyTheme(d.theme);
    }
  });
  try {
    if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'apihub:ready' }, '*');
  } catch (_) { /* 忽略 */ }
}

/* ═══════════════════════════════════════════════════════════════════
   15. 启动
   ═══════════════════════════════════════════════════════════════════ */

/** 左侧栏拖动改宽度：拖一次记住，双击回到默认 240。 */
function initSideResize() {
  const handle = $('#sideDrag');
  const side = document.querySelector('.side');
  if (!handle || !side) return;
  const KEY = LS_KEY.side;
  const apply = (w) => {
    const v = Math.round(clamp(w, 180, Math.max(200, window.innerWidth * 0.55)));
    document.documentElement.style.setProperty('--side-w', v + 'px');
    try { localStorage.setItem(KEY, String(v)); } catch (_) { /* 忽略 */ }
  };
  try {
    const saved = Number(localStorage.getItem(KEY));
    if (saved) apply(saved);
  } catch (_) { /* 忽略 */ }
  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handle.classList.add('on');
    const startX = e.clientX;
    const startW = side.getBoundingClientRect().width;
    const move = (ev) => apply(startW + (ev.clientX - startX));
    const up = () => {
      handle.classList.remove('on');
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  });
  handle.addEventListener('dblclick', () => apply(240));
}

async function boot() {
  initTheme();
  bindChrome();
  bindKeys();
  initSideResize();
  try { state.respFocus = localStorage.getItem('apihub.respFocus') === '1'; } catch (_) { /* 忽略 */ }
  if (state.respFocus) {
    const pane = document.querySelector('.pane');
    if (pane) pane.classList.add('respFocus');
  }
  try {
    const saved = localStorage.getItem(LS_KEY.open);
    if (saved) state.openFolders = JSON.parse(saved) || {};
  } catch (_) { /* 忽略 */ }
  try {
    const saved = localStorage.getItem(LS_KEY.openCollections);
    if (saved) state.openCollections = JSON.parse(saved) || {};
  } catch (_) { /* 忽略 */ }
  try {
    state.autoSave = localStorage.getItem(LS_KEY.auto) !== '0';
    state.respView = localStorage.getItem('apihub.respView') === 'raw' ? 'raw' : 'tree';
  } catch (_) { /* 忽略 */ }

  const info = await detectHost();
  if (info) {
    await bootHost(info);
  } else {
    state.mode = 'file';
    $('#modeTag').textContent = '单网页';
    paintDirty();
    renderSidebar();
    renderEditor();
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => { void boot(); }, { once: true });
} else {
  void boot();
}

})();
</script>
